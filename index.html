<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Speed Challenge</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
    }

    .difficulty-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .btn-diff {
      background: #334155;
      border: 2px solid transparent;
      color: var(--text);
      padding: 0.6rem 0.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.85rem;
    }

    .btn-diff.active {
      border-color: var(--accent);
      background-color: rgba(59, 130, 246, 0.2);
    }

    .custom-panel {
      background: #334155;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }

    .custom-panel.visible {
      display: flex;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.85rem;
      color: var(--subtext);
    }

    .control-group label span {
      color: var(--text);
      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .op-checks {
      display: flex;
      gap: 1rem;
      margin-top: 0.25rem;
    }

    .op-checks label {
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .timer-bar-container {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-weight: 600;
      color: var(--subtext);
    }

    .stats span {
      color: var(--text);
    }

    .problem-box {
      font-size: 3rem;
      font-weight: bold;
      text-align: center;
      margin: 1.5rem 0;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
    }

    input[type="number"] {
      flex: 1;
      padding: 0.8rem;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1.25rem;
      text-align: center;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    button.action-btn {
      background: var(--accent);
      color: var(--text);
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.action-btn:hover {
      background: var(--accent-hover);
    }

    .feedback {
      text-align: center;
      height: 1.5rem;
      margin-top: 1rem;
      font-weight: 600;
    }

    .feedback.correct { color: var(--success); }
    .feedback.wrong { color: var(--danger); }
  </style>
</head>
<body>

<div class="container">
  <h1>Math Speed Test</h1>

  <div class="difficulty-selector">
    <button class="btn-diff active" data-mode="easy">Easy<br><small>(5-7 yr)</small></button>
    <button class="btn-diff" data-mode="medium">Medium<br><small>(8-11 yr)</small></button>
    <button class="btn-diff" data-mode="hard">Hard<br><small>(12+ yr)</small></button>
    <button class="btn-diff" data-mode="custom">Custom</button>
  </div>

  <div class="custom-panel" id="customPanel">
    <div class="control-group">
      <label>Max Number: <span id="maxNumVal">20</span></label>
      <input type="range" id="maxNumInput" min="5" max="200" value="20" />
    </div>
    <div class="control-group">
      <label>Time per question: <span id="timerVal">10</span>s</label>
      <input type="range" id="timerInput" min="2" max="30" value="10" />
    </div>
    <div class="control-group">
      <label>Operations:</label>
      <div class="op-checks">
        <label><input type="checkbox" class="op-check" value="+" checked /> +</label>
        <label><input type="checkbox" class="op-check" value="-" checked /> -</label>
        <label><input type="checkbox" class="op-check" value="*" /> ×</label>
        <label><input type="checkbox" class="op-check" value="/" /> ÷</label>
      </div>
    </div>
  </div>

  <div class="timer-bar-container">
    <div class="timer-bar" id="timerBar"></div>
  </div>

  <div class="stats">
    <div>Score: <span id="score">0</span></div>
    <div>Streak: <span id="streak">0</span></div>
  </div>

  <div class="problem-box" id="problem">Press Start</div>

  <form id="gameForm" class="input-group">
    <input type="number" id="answerInput" placeholder="?" disabled autocomplete="off" />
    <button type="submit" class="action-btn" id="startSubmitBtn">Start</button>
  </form>

  <div class="feedback" id="feedback"></div>
</div>

<script>
  const presets = {
    easy: { maxNum: 10, timeLimit: 15, ops: ['+', '-'] },
    medium: { maxNum: 50, timeLimit: 10, ops: ['+', '-', '*'] },
    hard: { maxNum: 100, timeLimit: 5, ops: ['+', '-', '*', '/'] }
  };

  let currentMode = 'easy';
  let isPlaying = false;
  let score = 0;
  let streak = 0;
  let currentProblem = null;
  let timerInterval = null;
  let timeRemaining = 0;
  let totalTime = 15;

  // DOM Elements
  const diffBtns = document.querySelectorAll('.btn-diff');
  const customPanel = document.getElementById('customPanel');
  const maxNumInput = document.getElementById('maxNumInput');
  const maxNumVal = document.getElementById('maxNumVal');
  const timerInput = document.getElementById('timerInput');
  const timerVal = document.getElementById('timerVal');
  const opChecks = document.querySelectorAll('.op-check');
  const timerBar = document.getElementById('timerBar');
  const scoreEl = document.getElementById('score');
  const streakEl = document.getElementById('streak');
  const problemEl = document.getElementById('problem');
  const gameForm = document.getElementById('gameForm');
  const answerInput = document.getElementById('answerInput');
  const startSubmitBtn = document.getElementById('startSubmitBtn');
  const feedbackEl = document.getElementById('feedback');

  // Mode Selection
  diffBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      diffBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;

      if (currentMode === 'custom') {
        customPanel.classList.add('visible');
      } else {
        customPanel.classList.remove('visible');
      }
      if (isPlaying) stopGame();
    });
  });

  // Custom Controls Event Listeners
  maxNumInput.addEventListener('input', (e) => maxNumVal.textContent = e.target.value);
  timerInput.addEventListener('input', (e) => timerVal.textContent = e.target.value);

  function getActiveSettings() {
    if (currentMode !== 'custom') {
      return presets[currentMode];
    }
    const selectedOps = Array.from(opChecks)
      .filter(c => c.checked)
      .map(c => c.value);
    
    return {
      maxNum: parseInt(maxNumInput.value, 10),
      timeLimit: parseInt(timerInput.value, 10),
      ops: selectedOps.length > 0 ? selectedOps : ['+']
    };
  }

  function generateProblem() {
    const settings = getActiveSettings();
    const op = settings.ops[Math.floor(Math.random() * settings.ops.length)];
    let a, b, answer;

    switch (op) {
      case '+':
        a = Math.floor(Math.random() * settings.maxNum) + 1;
        b = Math.floor(Math.random() * settings.maxNum) + 1;
        answer = a + b;
        break;
      case '-':
        a = Math.floor(Math.random() * settings.maxNum) + 1;
        b = Math.floor(Math.random() * a) + 1; // Ensure non-negative output
        answer = a - b;
        break;
      case '*':
        const maxMult = Math.min(settings.maxNum, 12); // Keep multiplication sensible
        a = Math.floor(Math.random() * maxMult) + 1;
        b = Math.floor(Math.random() * settings.maxNum) + 1;
        answer = a * b;
        break;
      case '/':
        b = Math.floor(Math.random() * 10) + 1;
        answer = Math.floor(Math.random() * (settings.maxNum / 2)) + 1;
        a = b * answer; // Ensure whole integer division
        break;
    }

    const symbolMap = { '+': '+', '-': '-', '*': '×', '/': '÷' };
    return { question: `${a} ${symbolMap[op]} ${b}`, answer };
  }

  function startTimer() {
    clearInterval(timerInterval);
    const settings = getActiveSettings();
    totalTime = settings.timeLimit * 1000;
    timeRemaining = totalTime;
    
    const tickRate = 50;
    timerInterval = setInterval(() => {
      timeRemaining -= tickRate;
      const percentage = Math.max(0, (timeRemaining / totalTime) * 100);
      timerBar.style.width = percentage + '%';

      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, tickRate);
  }

  function nextQuestion() {
    currentProblem = generateProblem();
    problemEl.textContent = currentProblem.question;
    answerInput.value = '';
    answerInput.focus();
    startTimer();
  }

  function handleTimeout() {
    streak = 0;
    streakEl.textContent = streak;
    showFeedback('Time\'s up!', false);
    nextQuestion();
  }

  function showFeedback(msg, isCorrect) {
    feedbackEl.textContent = msg;
    feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
  }

  function startGame() {
    isPlaying = true;
    score = 0;
    streak = 0;
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    feedbackEl.textContent = '';
    
    startSubmitBtn.textContent = 'Submit';
    answerInput.disabled = false;
    nextQuestion();
  }

  function stopGame() {
    isPlaying = false;
    clearInterval(timerInterval);
    timerBar.style.width = '100%';
    problemEl.textContent = 'Press Start';
    answerInput.disabled = true;
    answerInput.value = '';
    startSubmitBtn.textContent = 'Start';
  }

  gameForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!isPlaying) {
      startGame();
      return;
    }

    const val = parseInt(answerInput.value, 10);
    if (isNaN(val)) return;

    if (val === currentProblem.answer) {
      score += 10 + (streak * 2); // Streak bonus
      streak++;
      showFeedback('Correct!', true);
    } else {
      streak = 0;
      showFeedback(`Wrong! Ans: ${currentProblem.answer}`, false);
    }

    scoreEl.textContent = score;
    streakEl.textContent = streak;
    nextQuestion();
  });
</script>

</body>
</html>
