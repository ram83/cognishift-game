<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CogniKids - Professional Brain Gym for Kids</title>
  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
          colors: {
            brand: {
              purple: '#7C3AED',
              pink: '#F43F5E',
              yellow: '#F59E0B',
              green: '#10B981',
              blue: '#06B6D4',
              bg: '#0B0F19'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #090d16, #2d123d);
      min-height: 100vh;
      color: #f8fafc;
      user-select: none;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Fredoka', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }
    .btn-3d {
      transition: all 0.15s ease;
      box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    }
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }
  </style>

  <!-- Firebase SDKs (Modular v9/v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged,
      sendPasswordResetEmail,
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      updateDoc,
      collection, 
      getDocs, 
      query, 
      orderBy, 
      limit, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- YOUR FIREBASE CONFIGURATION ---
  const firebaseConfig = {
  apiKey: "AIzaSyAwqb-RlbUQxrIfaROPXhGeLXzPMM9Cnxg",
  authDomain: "mindgames-f116a.firebaseapp.com",
  projectId: "mindgames-f116a",
  storageBucket: "mindgames-f116a.firebasestorage.app",
  messagingSenderId: "296415432842",
  appId: "1:296415432842:web:b97e2e2710f1c75ee89d73",
  measurementId: "G-HC8N4Y4R49"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.fbAuth = auth;
    window.fbDb = db;
    window.fbSignIn = signInWithEmailAndPassword;
    window.fbCreateUser = createUserWithEmailAndPassword;
    window.fbSignOut = signOut;
    window.fbResetPassword = sendPasswordResetEmail;
    window.fbUpdateProfile = updateProfile;
    window.fbDoc = doc;
    window.fbGetDoc = getDoc;
    window.fbSetDoc = setDoc;
    window.fbUpdateDoc = updateDoc;
    window.fbCollection = collection;
    window.fbGetDocs = getDocs;
    window.fbQuery = query;
    window.fbOrderBy = orderBy;
    window.fbLimit = limit;
    window.fbTimestamp = serverTimestamp;

    onAuthStateChanged(auth, async (user) => {
      window.currentUser = user;
      if (user) {
        try {
          const userDocRef = doc(db, "users", user.uid);
          const userSnap = await getDoc(userDocRef);
          if (userSnap.exists()) {
            window.currentUserData = userSnap.data();
            if (window.currentUserData.profileCompleted) {
              if (window.app && window.app.navToDashboard) window.app.navToDashboard();
            } else {
              if (window.app && window.app.renderOnboarding) window.app.renderOnboarding();
            }
          } else {
            if (window.app && window.app.renderOnboarding) window.app.renderOnboarding();
          }
        } catch (err) {
          console.error("Error fetching user profile:", err);
        }
      } else {
        window.currentUserData = null;
        if (window.app && window.app.renderAuth) window.app.renderAuth('signin');
      }
    });
  </script>
</head>
<body class="flex flex-col min-h-screen overflow-x-hidden">

  <!-- Header Bar -->
  <header class="w-full py-4 px-8 flex justify-between items-center glass-card border-b border-white/10 z-50 sticky top-0">
    <div class="flex items-center gap-3 cursor-pointer" onclick="app.navToDashboard()">
      <div class="text-3xl">🧠</div>
      <span class="font-heading text-2xl font-bold bg-gradient-to-r from-yellow-300 via-pink-400 to-cyan-300 bg-clip-text text-transparent">
        CogniKids Gym
      </span>
    </div>

    <div id="header-profile" class="hidden flex items-center gap-4">
      <div class="flex items-center gap-3 bg-white/10 py-1.5 px-5 rounded-full border border-white/20 shadow-inner">
        <span id="nav-avatar" class="text-2xl">🐉</span>
        <div>
          <p id="nav-username" class="font-bold text-sm text-yellow-300 leading-tight">Kiddo</p>
          <p id="nav-rank" class="text-xs text-cyan-200 font-semibold">Trainee 🥉</p>
        </div>
      </div>
      <button onclick="app.logout()" class="text-xs text-white/50 hover:text-white underline">Sign Out</button>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app-container" class="flex-grow flex items-center justify-center p-6">
    <!-- Dynamic views load here -->
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-white/40 tracking-wider">
    CogniKids Professional Cognitive Training Suite &copy; 2026
  </footer>

  <script>
    const TOTAL_ROUNDS = 9;
    const MAX_LEVELS = 12; // Capped strictly at 12 levels max per round

    const sfx = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playTone(freq, type = 'sine', duration = 0.15) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      correct() {
        this.playTone(523.25, 'triangle', 0.12);
        setTimeout(() => this.playTone(659.25, 'triangle', 0.12), 120);
        setTimeout(() => this.playTone(783.99, 'triangle', 0.25), 240);
      },
      wrong() {
        this.playTone(200, 'sawtooth', 0.2);
        setTimeout(() => this.playTone(150, 'sawtooth', 0.3), 150);
      },
      click() {
        this.playTone(440, 'sine', 0.05);
      }
    };

    window.app = {
      logout() {
        if (window.fbSignOut && window.fbAuth) {
          window.fbSignOut(window.fbAuth);
        }
      },
      updateHeader() {
        const profileEl = document.getElementById('header-profile');
        if (!window.currentUserData) {
          profileEl.classList.add('hidden');
          return;
        }
        profileEl.classList.remove('hidden');
        document.getElementById('nav-avatar').textContent = window.currentUserData.avatarIcon || '🐉';
        document.getElementById('nav-username').textContent = window.currentUserData.firstName || window.currentUserData.username || 'Kiddo';
      },
      navToDashboard() {
        this.updateHeader();
        document.getElementById('app-container').innerHTML = `
          <div class="glass-card p-8 rounded-3xl text-center space-y-4">
            <h2 class="font-heading text-3xl font-bold text-yellow-300">Dashboard Loaded</h2>
            <p class="text-sm text-white/70">Round 9 replaced with <strong class="text-cyan-300">Word Category Match</strong> (Max ${MAX_LEVELS} levels).</p>
          </div>
        `;
      },
      renderAuth(mode) {
        document.getElementById('app-container').innerHTML = `
          <div class="glass-card p-8 rounded-3xl text-center">
            <h2 class="text-2xl text-yellow-300 mb-4">Please Sign In</h2>
            <p class="text-sm text-white/60">Firebase authentication active.</p>
          </div>
        `;
      },
      renderOnboarding() {
        document.getElementById('app-container').innerHTML = `
          <div class="glass-card p-8 rounded-3xl text-center">
            <h2 class="text-2xl text-yellow-300 mb-4">Complete Your Profile</h2>
          </div>
        `;
      }
    };
  </script>
</body>
</html>
