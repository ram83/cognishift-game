<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CogniShift | Cognitive Speed Test</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <!-- FIREBASE SDKs (v10 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      sendPasswordResetEmail, 
      onAuthStateChanged,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      query, 
      orderBy, 
      limit, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔑 REPLACE WITH YOUR FIREBASE CONFIG KEYS
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAwqb-RlbUQxrIfaROPXhGeLXzPMM9Cnxg",
  authDomain: "mindgames-f116a.firebaseapp.com",
  projectId: "mindgames-f116a",
  storageBucket: "mindgames-f116a.firebasestorage.app",
  messagingSenderId: "296415432842",
  appId: "1:296415432842:web:b97e2e2710f1c75ee89d73",
  measurementId: "G-HC8N4Y4R49"
};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Make Firebase methods globally accessible to UI functions
    window.fbAuth = auth;
    window.fbDb = db;
    window.fbCreateUser = createUserWithEmailAndPassword;
    window.fbSignIn = signInWithEmailAndPassword;
    window.fbSignOut = signOut;
    window.fbResetPassword = sendPasswordResetEmail;
    window.fbUpdateProfile = updateProfile;
    window.fbAddDoc = addDoc;
    window.fbGetDocs = getDocs;
    window.fbCollection = collection;
    window.fbQuery = query;
    window.fbOrderBy = orderBy;
    window.fbLimit = limit;
    window.fbTimestamp = serverTimestamp;

    // Monitor Auth State Changes
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.currentUser = user;
        showDashboard();
      } else {
        window.currentUser = null;
        navigateTo('screen-auth');
      }
    });
  </script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --success: #10b981;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .brand-title { font-size: 2rem; font-weight: 800; color: var(--text-main); text-align: center; }
    .brand-subtitle { font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; }

    .screen { display: none; }
    .screen.active { display: block; }

    .auth-tabs { display: flex; background: var(--bg-dark); border-radius: 10px; padding: 4px; margin-bottom: 1.5rem; }
    .auth-tab { flex: 1; text-align: center; padding: 0.5rem; font-size: 0.875rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-radius: 8px; transition: all 0.2s; }
    .auth-tab.active { background: var(--card-bg); color: var(--text-main); }

    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.35rem; }
    .input-field {
      width: 100%;
      padding: 0.875rem 1rem;
      background: var(--bg-dark);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .input-field:focus { border-color: var(--primary); }

    .btn {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; margin-top: 0.5rem; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--card-border); margin-top: 0.75rem; }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); color: #fff; }

    .link-btn { background: none; border: none; color: var(--accent); font-size: 0.8rem; cursor: pointer; text-decoration: underline; margin-top: 0.5rem; display: inline-block; }
    .error-msg { color: var(--danger); font-size: 0.8rem; margin-top: 0.5rem; text-align: center; display: none; }
    .success-msg { color: var(--success); font-size: 0.8rem; margin-top: 0.5rem; text-align: center; display: none; }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 2rem; width: 100%; max-width: 400px; }

    /* Game Stage & HUD */
    .hud { display: flex; justify-content: space-between; background: var(--bg-dark); padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; }
    .hud-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .hud-val { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; }
    .game-target { font-size: 2.75rem; font-weight: 800; text-align: center; margin: 2rem 0; min-height: 60px; }
    .game-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-match { background: var(--success); color: #fff; }
    .btn-no-match { background: var(--danger); color: #fff; }

    .leader-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    .leader-table th { text-align: left; color: var(--text-muted); padding-bottom: 0.5rem; border-bottom: 1px solid var(--card-border); }
    .leader-table td { padding: 0.75rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .leader-table td:last-child { text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- SCREEN 1: AUTHENTICATION -->
    <div id="screen-auth" class="screen active">
      <h1 class="brand-title">CogniShift</h1>
      <p class="brand-subtitle">Firebase Authentication</p>

      <div class="auth-tabs">
        <div id="tab-signin" class="auth-tab active" onclick="switchAuthMode('signin')">Sign In</div>
        <div id="tab-signup" class="auth-tab" onclick="switchAuthMode('signup')">Sign Up</div>
      </div>

      <!-- Sign In Form -->
      <form id="form-signin" onsubmit="handleSignIn(event)">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="signin-email" class="input-field" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="signin-pass" class="input-field" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary">Sign In</button>
        <div style="text-align: center;">
          <button type="button" class="link-btn" onclick="openForgotModal()">Forgot Password?</button>
        </div>
      </form>

      <!-- Sign Up Form -->
      <form id="form-signup" onsubmit="handleSignUp(event)" style="display: none;">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="signup-user" class="input-field" required placeholder="Choose username" maxlength="15">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="signup-email" class="input-field" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="signup-pass" class="input-field" required placeholder="Min. 6 characters">
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <div id="auth-error" class="error-msg"></div>
      <div id="auth-success" class="success-msg"></div>
    </div>

    <!-- SCREEN 2: HOMEPAGE / DASHBOARD -->
    <div id="screen-home" class="screen">
      <h1 class="brand-title">Dashboard</h1>
      <p class="brand-subtitle">Welcome, <span id="user-display-name" style="color: var(--accent);"></span>!</p>

      <button class="btn btn-primary" onclick="navigateTo('screen-game'); startNewGame();">Play Stroop Speed Test</button>

      <div style="margin-top: 2rem;">
        <h3 style="font-size: 1rem; color: var(--text-main);">Global Leaderboard (Firebase)</h3>
        <table class="leader-table">
          <thead>
            <tr><th>Rank</th><th>Player</th><th>Score</th></tr>
          </thead>
          <tbody id="leaderboard-body"></tbody>
        </table>
      </div>

      <button class="btn btn-secondary" onclick="handleLogout()">Sign Out</button>
    </div>

    <!-- SCREEN 3: GAME STAGE -->
    <div id="screen-game" class="screen">
      <div class="hud">
        <div><div class="hud-label">Score</div><div class="hud-val" id="score-val">0</div></div>
        <div><div class="hud-label">Time</div><div class="hud-val" id="time-val" style="color: var(--accent);">30s</div></div>
      </div>

      <p style="text-align: center; color: var(--text-muted); font-size: 0.875rem;">Does text meaning match the ink color?</p>
      <div class="game-target" id="game-target">---</div>

      <div class="game-controls">
        <button class="btn btn-no-match" onclick="submitChoice(false)">No Match</button>
        <button class="btn btn-match" onclick="submitChoice(true)">Match</button>
      </div>

      <button class="btn btn-secondary" onclick="navigateTo('screen-home'); stopGame();" style="margin-top: 1.5rem;">Quit Session</button>
    </div>

  </div>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="modal-forgot" class="modal-overlay">
    <div class="modal-card">
      <h3 style="margin-bottom: 0.5rem; color: var(--text-main);">Reset Password</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem;">Enter your email address to receive a secure Firebase reset link.</p>
      
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="forgot-email" class="input-field" placeholder="name@example.com">
      </div>

      <button class="btn btn-primary" onclick="sendPasswordReset()">Send Reset Email</button>
      <button class="btn btn-secondary" onclick="closeForgotModal()">Cancel</button>
      
      <div id="modal-msg" class="error-msg"></div>
    </div>
  </div>

  <script>
    const COLORS = [
      { name: 'RED', hex: '#ef4444' },
      { name: 'BLUE', hex: '#3b82f6' },
      { name: 'GREEN', hex: '#10b981' },
      { name: 'YELLOW', hex: '#eab308' }
    ];

    let currentScore = 0;
    let timer = 30;
    let timerInterval = null;
    let isMatch = false;

    function navigateTo(screenId) {
      if ((screenId === 'screen-home' || screenId === 'screen-game') && !window.currentUser) {
        screenId = 'screen-auth';
      }
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function switchAuthMode(mode) {
      hideAuthMsgs();
      if (mode === 'signin') {
        document.getElementById('tab-signin').classList.add('active');
        document.getElementById('tab-signup').classList.remove('active');
        document.getElementById('form-signin').style.display = 'block';
        document.getElementById('form-signup').style.display = 'none';
      } else {
        document.getElementById('tab-signup').classList.add('active');
        document.getElementById('tab-signin').classList.remove('active');
        document.getElementById('form-signup').style.display = 'block';
        document.getElementById('form-signin').style.display = 'none';
      }
    }

    function hideAuthMsgs() {
      document.getElementById('auth-error').style.display = 'none';
      document.getElementById('auth-success').style.display = 'none';
    }

    /* FIREBASE AUTH ACTIONS */
    async function handleSignUp(e) {
      e.preventDefault();
      const userStr = document.getElementById('signup-user').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const pass = document.getElementById('signup-pass').value.trim();
      const errEl = document.getElementById('auth-error');

      try {
        const userCred = await window.fbCreateUser(window.fbAuth, email, pass);
        await window.fbUpdateProfile(userCred.user, { displayName: userStr });
        window.currentUser = userCred.user;
        showDashboard();
      } catch (err) {
        errEl.textContent = err.message.replace("Firebase: ", "");
        errEl.style.display = 'block';
      }
    }

    async function handleSignIn(e) {
      e.preventDefault();
      const email = document.getElementById('signin-email').value.trim();
      const pass = document.getElementById('signin-pass').value.trim();
      const errEl = document.getElementById('auth-error');

      try {
        await window.fbSignIn(window.fbAuth, email, pass);
      } catch (err) {
        errEl.textContent = "Invalid email or password.";
        errEl.style.display = 'block';
      }
    }

    async function sendPasswordReset() {
      const email = document.getElementById('forgot-email').value.trim();
      const msgEl = document.getElementById('modal-msg');

      if (!email) {
        msgEl.textContent = "Please enter your email address.";
        msgEl.style.display = 'block';
        return;
      }

      try {
        await window.fbResetPassword(window.fbAuth, email);
        closeForgotModal();
        const successEl = document.getElementById('auth-success');
        successEl.textContent = `Password reset link sent to ${email}`;
        successEl.style.display = 'block';
      } catch (err) {
        msgEl.textContent = err.message.replace("Firebase: ", "");
        msgEl.style.display = 'block';
      }
    }

    function handleLogout() {
      window.fbSignOut(window.fbAuth);
      stopGame();
      navigateTo('screen-auth');
    }

    function openForgotModal() {
      document.getElementById('modal-forgot').classList.add('active');
      document.getElementById('modal-msg').style.display = 'none';
    }

    function closeForgotModal() {
      document.getElementById('modal-forgot').classList.remove('active');
    }

    function showDashboard() {
      const name = window.currentUser.displayName || window.currentUser.email.split('@')[0];
      document.getElementById('user-display-name').textContent = name;
      renderLeaderboard();
      navigateTo('screen-home');
    }

    /* GAME ENGINE */
    function startNewGame() {
      currentScore = 0;
      timer = 30;
      document.getElementById('score-val').textContent = '0';
      document.getElementById('time-val').textContent = '30s';
      
      nextQuestion();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer--;
        document.getElementById('time-val').textContent = `${timer}s`;
        if (timer <= 0) {
          stopGame();
          saveScore(currentScore);
          alert(`Game Over! Final Score: ${currentScore}`);
          showDashboard();
        }
      }, 1000);
    }

    function stopGame() {
      clearInterval(timerInterval);
    }

    function nextQuestion() {
      const textObj = COLORS[Math.floor(Math.random() * COLORS.length)];
      const colorObj = COLORS[Math.floor(Math.random() * COLORS.length)];
      
      isMatch = Math.random() < 0.5;
      const targetEl = document.getElementById('game-target');
      
      targetEl.textContent = textObj.name;
      targetEl.style.color = isMatch ? textObj.hex : colorObj.hex;
    }

    function submitChoice(userChoice) {
      if (timer <= 0) return;
      if (userChoice === isMatch) {
        currentScore += 100;
      } else {
        currentScore = Math.max(0, currentScore - 50);
      }
      document.getElementById('score-val').textContent = currentScore;
      nextQuestion();
    }

    /* FIRESTORE LEADERBOARD ACTIONS */
    async function saveScore(score) {
      try {
        const username = window.currentUser.displayName || window.currentUser.email.split('@')[0];
        await window.fbAddDoc(window.fbCollection(window.fbDb, "scores"), {
          user: username,
          score: score,
          createdAt: window.fbTimestamp()
        });
      } catch (e) {
        console.error("Error saving score to Firebase: ", e);
      }
    }

    async function renderLeaderboard() {
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--text-muted)">Loading scores...</td></tr>';

      try {
        const q = window.fbQuery(
          window.fbCollection(window.fbDb, "scores"), 
          window.fbOrderBy("score", "desc"), 
          window.fbLimit(5)
        );
        const querySnapshot = await window.fbGetDocs(q);
        
        tbody.innerHTML = querySnapshot.empty ? 
          '<tr><td colspan="3" style="text-align:center; color:var(--text-muted)">No high scores recorded</td></tr>' : '';

        let idx = 1;
        querySnapshot.forEach((doc) => {
          const s = doc.data();
          tbody.innerHTML += `
            <tr>
              <td>#${idx++}</td>
              <td>${escapeHTML(s.user)}</td>
              <td>${s.score}</td>
            </tr>`;
        });
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--danger)">Error loading scores</td></tr>';
      }
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
