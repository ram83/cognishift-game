<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CogniShift | Mind Games</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #16a34a;
      --error: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .game-area {
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .number-display {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: 0.25rem;
      color: var(--primary);
      margin: 1.5rem 0;
    }

    .instruction {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    input[type="text"] {
      width: 100%;
      max-width: 280px;
      padding: 0.75rem 1rem;
      font-size: 1.25rem;
      text-align: center;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .btn {
      background-color: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
      max-width: 280px;
    }

    .btn:hover { background-color: var(--primary-hover); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-msg {
      margin-top: 1rem;
      font-weight: 600;
      min-height: 24px;
    }

    .status-msg.correct { color: var(--success); }
    .status-msg.incorrect { color: var(--error); }

    .leaderboard-card {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 1.5rem;
      width: 100%;
      text-align: left;
    }

    .leaderboard-card h3 {
      font-size: 1rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      font-size: 1rem;
    }

    .stat-row strong { color: var(--text-main); }
  </style>
</head>
<body>

  <div class="container">
    <h1>CogniShift</h1>
    <p class="subtitle">Working Memory & Cognitive Flexibility Test</p>

    <div id="game-box" class="game-area">
      <p class="instruction">Test your digit span memory in reverse sequence.</p>
      <button id="start-btn" class="btn" onclick="startRound()">Start Game</button>
    </div>

    <div id="status" class="status-msg"></div>
  </div>

  <script>
    // Live Render Private Backend URL
    const BACKEND_URL = "https://cognishift-game.onrender.com";

    let currentSessionId = "";
    let currentDigits = 3;
    let score = 0;

    const gameBox = document.getElementById('game-box');
    const statusDiv = document.getElementById('status');

    // 1. Request sequence from Render server
    async function startRound() {
      statusDiv.textContent = "";
      gameBox.innerHTML = `<p class="instruction">Preparing round...</p>`;

      try {
        const response = await fetch(`${BACKEND_URL}/api/start-r1`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ digits: currentDigits })
        });

        if (!response.ok) throw new Error("Server communication failed.");

        const data = await response.json();
        currentSessionId = data.sessionId;

        // Flash target sequence on screen
        gameBox.innerHTML = `
          <p class="instruction">Memorize the digits:</p>
          <div class="number-display">${data.sequence}</div>
        `;

        // Hide sequence after 2 seconds and request reverse input
        setTimeout(() => {
          renderInputScreen();
        }, 2000);

      } catch (err) {
        gameBox.innerHTML = `
          <p class="instruction" style="color: var(--error);">Could not connect to server.</p>
          <button class="btn" onclick="startRound()">Retry</button>
        `;
        console.error(err);
      }
    }

    // 2. Render input box
    function renderInputScreen() {
      gameBox.innerHTML = `
        <p class="instruction">Enter the sequence in REVERSE:</p>
        <input type="text" id="user-input" maxlength="${currentDigits}" placeholder="e.g. 321" autofocus autocomplete="off" />
        <button id="submit-btn" class="btn" onclick="submitAnswer()">Submit Answer</button>
      `;

      // Allow pressing 'Enter' to submit
      document.getElementById('user-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') submitAnswer();
      });
    }

    // 3. Send answer to server for verification
    async function submitAnswer() {
      const inputEl = document.getElementById('user-input');
      const submitBtn = document.getElementById('submit-btn');
      const userInput = inputEl.value.trim();

      if (!userInput) return;

      submitBtn.disabled = true;
      statusDiv.textContent = "Verifying...";

      try {
        const response = await fetch(`${BACKEND_URL}/api/verify-r1`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId: currentSessionId,
            userInput: userInput
          })
        });

        const result = await response.json();

        if (result.success) {
          score += 10;
          currentDigits += 1; // Increase difficulty
          statusDiv.className = "status-msg correct";
          statusDiv.textContent = "Correct! Difficulty increasing...";
          
          setTimeout(() => {
            startRound();
          }, 1200);

        } else {
          statusDiv.className = "status-msg incorrect";
          statusDiv.textContent = "Incorrect!";
          endGame();
        }

      } catch (err) {
        statusDiv.className = "status-msg incorrect";
        statusDiv.textContent = "Error verifying answer.";
        submitBtn.disabled = false;
      }
    }

    // 4. End Game & Fetch Global Stats from Server
    async function endGame() {
      gameBox.innerHTML = `<p class="instruction">Calculating score & rank...</p>`;

      try {
        const response = await fetch(`${BACKEND_URL}/api/leaderboard-stats?score=${score}`);
        const stats = await response.json();

        gameBox.innerHTML = `
          <p class="instruction">Game Over!</p>
          <div class="number-display" style="font-size: 2.5rem; margin: 0.5rem 0;">${score} pts</div>

          <div class="leaderboard-card">
            <h3>Global Standings</h3>
            <div class="stat-row">
              <span>Your Rank:</span>
              <strong>#${stats.playerRank} of ${stats.totalPlayers}</strong>
            </div>
            <div class="stat-row">
              <span>#1 Leader (${stats.topLeaderName}):</span>
              <strong>${stats.topLeaderScore} pts</strong>
            </div>
          </div>

          <button class="btn" style="margin-top: 1.5rem;" onclick="resetGame()">Play Again</button>
        `;
      } catch (err) {
        gameBox.innerHTML = `
          <p class="instruction">Game Over! Final Score: ${score}</p>
          <button class="btn" onclick="resetGame()">Play Again</button>
        `;
      }
    }

    // Reset game state
    function resetGame() {
      score = 0;
      currentDigits = 3;
      statusDiv.textContent = "";
      startRound();
    }
  </script>
</body>
</html>
