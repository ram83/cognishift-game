<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CogniKids - Train Your Brain!</title>
  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
          colors: {
            brand: {
              purple: '#7C3AED',
              pink: '#F43F5E',
              yellow: '#F59E0B',
              green: '#10B981',
              blue: '#06B6D4',
              bg: '#0F172A'
            }
          },
          animation: {
            'bounce-slow': 'bounce 2s infinite',
            'pulse-fast': 'pulse 0.8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #311042);
      min-height: 100vh;
      color: #f8fafc;
      user-select: none;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Fredoka', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .btn-3d {
      transition: all 0.1s ease;
      box-shadow: 0 6px 0 rgba(0,0,0,0.25);
    }
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.25);
    }
    .clock-face {
      box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen overflow-x-hidden">

  <!-- Header Bar -->
  <header class="w-full py-4 px-6 flex justify-between items-center glass-card border-b border-white/10 z-50 sticky top-0">
    <div class="flex items-center gap-3 cursor-pointer" onclick="app.navToDashboard()">
      <div class="text-3xl animate-bounce-slow">🧠</div>
      <span class="font-heading text-2xl font-bold bg-gradient-to-r from-yellow-300 via-pink-400 to-cyan-300 bg-clip-text text-transparent">
        CogniKids
      </span>
    </div>

    <!-- Right Profile Status Widget (When Logged In) -->
    <div id="header-profile" class="hidden flex items-center gap-4">
      <div class="flex items-center gap-3 bg-white/10 py-1.5 px-4 rounded-full border border-white/20">
        <span id="nav-avatar" class="text-2xl animate-float">🐉</span>
        <div>
          <p id="nav-username" class="font-bold text-sm text-yellow-300 leading-tight">Kiddo</p>
          <p id="nav-rank" class="text-xs text-cyan-200 font-semibold">Diligent 🥉</p>
        </div>
      </div>
      <button onclick="app.logout()" class="text-xs text-white/60 hover:text-white underline">Sign Out</button>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app-container" class="flex-grow flex items-center justify-center p-4">
    <!-- Views rendered dynamically -->
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-white/40">
    CogniKids &copy; 2026 • Fun Cognitive Skill Training for Kids
  </footer>

  <!-- Application Logic & Firebase Integration -->
  <script>
    // --- AUDIO SYNTHESIZER FOR SFX ---
    const sfx = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playTone(freq, type = 'sine', duration = 0.15) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      correct() {
        this.playTone(523.25, 'triangle', 0.1);
        setTimeout(() => this.playTone(659.25, 'triangle', 0.1), 100);
        setTimeout(() => this.playTone(783.99, 'triangle', 0.2), 200);
      },
      wrong() {
        this.playTone(220, 'sawtooth', 0.15);
        setTimeout(() => this.playTone(180, 'sawtooth', 0.25), 150);
      },
      click() {
        this.playTone(400, 'sine', 0.05);
      }
    };

    const AVATARS = [
      { id: 'dragon', name: 'Dragon', icon: '🐉' },
      { id: 'mermaid', name: 'Mermaid', icon: '🧜‍♀️' },
      { id: 'dolphin', name: 'Dolphin', icon: '🐬' },
      { id: 'ram', name: 'Ram', icon: '🐏' },
      { id: 'lion', name: 'Lion', icon: '🦁' },
      { id: 'bear', name: 'Bear', icon: '🐻' },
      { id: 'tiger', name: 'Tiger', icon: '🐯' },
      { id: 'unicorn', name: 'Unicorn', icon: '🦄' },
      { id: 'dog', name: 'Dog', icon: '🐶' },
      { id: 'cat', name: 'Cat', icon: '🐱' },
      { id: 'python', name: 'Python', icon: '🐍' },
      { id: 'phoenix', name: 'Phoenix', icon: '🦅' }
    ];

    const FUN_FACTS = [
      "Octopuses have three hearts and blue blood! 🐙",
      "Honey never spoils. Yummy 3,000-year-old honey is edible! 🍯",
      "A day on Venus is longer than a year on Venus! 🪐",
      "Bananas are naturally slightly radioactive! 🍌",
      "Dolphins give each other individual names with whistles! 🐬",
      "Your brain uses 20% of all the energy in your body! 🧠",
      "Cows have best friends and get stressed when separated! 🐮",
      "Sharks existed before trees were on Earth! 🦈"
    ];

    const FUNNY_GREETINGS = [
      "Welcome back, Captain {name}! Ready to flex those super-brain muscles?",
      "Hey {name}! Did you know your brain is 100x cooler today?",
      "Greetings, Mastermind {name}! Your neural pathways are shining!",
      "Look who's back! The legendary {name} is here to break records!"
    ];

    const state = {
      currentSessionScore: 0,
      activeGameIndex: 0,
      gameStats: {
        game1: { score: 0 },
        game2: { score: 0 }
      }
    };

    function calculateRank(highScore) {
      if (highScore >= 600) return { title: 'Gifted', badge: '🏆', class: 'text-amber-300' };
      if (highScore >= 350) return { title: 'Genius', badge: '🥇', class: 'text-yellow-400' };
      if (highScore >= 150) return { title: 'Smart', badge: '🥈', class: 'text-slate-300' };
      return { title: 'Diligent', badge: '🥉', class: 'text-amber-600' };
    }

    // --- MAIN APP CONTROLLER ---
    window.app = {
      logout() {
        if (window.fbSignOut && window.fbAuth) {
          window.fbSignOut(window.fbAuth);
        }
      },

      updateHeader() {
        const profileEl = document.getElementById('header-profile');
        if (!window.currentUserData) {
          profileEl.classList.add('hidden');
          return;
        }
        profileEl.classList.remove('hidden');
        document.getElementById('nav-avatar').textContent = window.currentUserData.avatarIcon || '🐉';
        document.getElementById('nav-username').textContent = window.currentUserData.firstName || window.currentUserData.username || 'Kiddo';
        
        const stats = window.currentUserData.stats || {};
        const rank = calculateRank(stats.highestScore || 0);
        document.getElementById('nav-rank').textContent = `${rank.title} ${rank.badge}`;
      },

      renderAuth(mode = 'signin') {
        const container = document.getElementById('app-container');
        container.innerHTML = `
          <div class="glass-card w-full max-w-md p-8 rounded-3xl border border-white/20 shadow-2xl relative overflow-hidden">
            <div class="text-center mb-6">
              <h2 class="font-heading text-3xl font-bold text-yellow-300 mb-2">
                ${mode === 'signin' ? 'Welcome Back!' : mode === 'signup' ? 'Create Account' : 'Reset Password'}
              </h2>
              <p class="text-sm text-cyan-200">
                ${mode === 'signin' ? 'Ready to play and train your brain?' : mode === 'signup' ? 'Join CogniKids and start your adventure!' : 'Enter your email to recover your account.'}
              </p>
            </div>

            ${mode !== 'forgot' ? `
            <div class="flex bg-white/10 p-1 rounded-2xl mb-6">
              <button onclick="sfx.click(); app.renderAuth('signin')" class="flex-1 py-2 rounded-xl text-sm font-bold transition-all ${mode === 'signin' ? 'bg-brand-purple text-white shadow-lg' : 'text-white/60 hover:text-white'}">Sign In</button>
              <button onclick="sfx.click(); app.renderAuth('signup')" class="flex-1 py-2 rounded-xl text-sm font-bold transition-all ${mode === 'signup' ? 'bg-brand-purple text-white shadow-lg' : 'text-white/60 hover:text-white'}">Sign Up</button>
            </div>
            ` : ''}

            <form onsubmit="app.handleAuthSubmit(event, '${mode}')" class="space-y-4">
              ${mode === 'signup' ? `
              <div>
                <label class="block text-xs font-bold text-white/80 mb-1">Unique Username</label>
                <input id="auth-username" type="text" required placeholder="Choose a unique handle" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
              </div>
              ` : ''}

              <div>
                <label class="block text-xs font-bold text-white/80 mb-1">Email Address</label>
                <input id="auth-email" type="email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
              </div>

              <div>
                <label class="block text-xs font-bold text-white/80 mb-1">Password</label>
                <input id="auth-password" type="password" ${mode !== 'forgot' ? 'required' : ''} placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
              </div>

              ${mode === 'signin' ? `
              <div class="text-right">
                <button type="button" onclick="app.renderAuth('forgot')" class="text-xs text-yellow-300 hover:underline">Forgot Password?</button>
              </div>
              ` : ''}

              <button type="submit" class="w-full py-3 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 font-heading text-lg font-bold rounded-xl btn-3d hover:brightness-110">
                ${mode === 'signin' ? 'Sign In 🚀' : mode === 'signup' ? 'Continue to Onboarding 🎨' : 'Send Reset Link 📧'}
              </button>
            </form>

            <div id="auth-status" class="mt-4 text-center text-xs"></div>

            ${mode === 'forgot' ? `
            <div class="text-center mt-4">
              <button onclick="app.renderAuth('signin')" class="text-xs text-cyan-300 hover:underline">← Back to Sign In</button>
            </div>
            ` : ''}
          </div>
        `;
      },

      async handleAuthSubmit(e, mode) {
        e.preventDefault();
        sfx.click();
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const statusEl = document.getElementById('auth-status');

        try {
          if (mode === 'signup') {
            const username = document.getElementById('auth-username').value.trim().toLowerCase();
            if (username.length < 3) {
              statusEl.textContent = "Username must be at least 3 characters.";
              statusEl.className = "mt-4 text-center text-xs text-red-400";
              return;
            }

            const usernameRef = window.fbDoc(window.fbDb, "usernames", username);
            const usernameSnap = await window.fbGetDoc(usernameRef);
            if (usernameSnap.exists()) {
              statusEl.textContent = "Username is already taken.";
              statusEl.className = "mt-4 text-center text-xs text-red-400";
              return;
            }

            const userCred = await window.fbCreateUser(window.fbAuth, email, password);
            await window.fbUpdateProfile(userCred.user, { displayName: username });

            await window.fbSetDoc(usernameRef, { uid: userCred.user.uid });
            await window.fbSetDoc(window.fbDoc(window.fbDb, "users", userCred.user.uid), {
              username: username,
              email: email,
              profileCompleted: false,
              createdAt: window.fbTimestamp(),
              stats: { totalSessions: 0, highestScore: 0, maxSequenceLength: 0 }
            });
          } else if (mode === 'signin') {
            await window.fbSignIn(window.fbAuth, email, password);
          } else {
            await window.fbResetPassword(window.fbAuth, email);
            statusEl.textContent = "Reset link dispatched. Check your inbox.";
            statusEl.className = "mt-4 text-center text-xs text-green-400";
          }
        } catch (err) {
          statusEl.textContent = err.message.replace("Firebase: ", "");
          statusEl.className = "mt-4 text-center text-xs text-red-400";
        }
      },

      renderOnboarding() {
        const container = document.getElementById('app-container');
        container.innerHTML = `
          <div class="glass-card w-full max-w-2xl p-8 rounded-3xl border border-white/20 shadow-2xl my-8">
            <h2 class="font-heading text-3xl font-bold text-center text-yellow-300 mb-2">Tell Us About Yourself! 🎉</h2>
            <p class="text-center text-sm text-cyan-200 mb-6">Customize your profile to kickstart your cognitive journey.</p>

            <form onsubmit="app.handleOnboardingSubmit(event)" class="space-y-6">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">First Name</label>
                  <input id="ob-firstname" type="text" required placeholder="Alex" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">Last Name</label>
                  <input id="ob-lastname" type="text" required placeholder="Smith" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-white/80 mb-2">Choose Your Avatar Companion</label>
                <div class="grid grid-cols-4 sm:grid-cols-6 gap-3 max-h-48 overflow-y-auto p-2 bg-black/20 rounded-2xl border border-white/10">
                  ${AVATARS.map((a, i) => `
                    <button type="button" onclick="app.selectAvatar('${a.icon}', this)" class="avatar-opt p-3 text-3xl rounded-xl border border-white/10 bg-white/5 hover:bg-white/20 transition-all ${i === 0 ? 'ring-4 ring-yellow-400 bg-white/20' : ''}">
                      ${a.icon}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">Date of Birth</label>
                  <input id="ob-dob" type="date" required class="w-full px-3 py-3 rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">Gender</label>
                  <select id="ob-gender" required class="w-full px-3 py-3 rounded-xl bg-slate-800 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="Boy">Boy</option>
                    <option value="Girl">Girl</option>
                    <option value="Non-binary">Non-binary</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">Country</label>
                  <select id="ob-country" required class="w-full px-3 py-3 rounded-xl bg-slate-800 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="USA">United States</option>
                    <option value="UK">United Kingdom</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                    <option value="India">India</option>
                    <option value="South Korea">South Korea</option>
                    <option value="Japan">Japan</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>

              <input type="hidden" id="selected-avatar-val" value="${AVATARS[0].icon}">

              <button type="submit" class="w-full py-4 bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-900 font-heading text-xl font-bold rounded-2xl btn-3d hover:brightness-110">
                Ready to Explore! 🌟
              </button>
            </form>
          </div>
        `;
      },

      selectAvatar(icon, btn) {
        sfx.click();
        document.querySelectorAll('.avatar-opt').forEach(b => b.classList.remove('ring-4', 'ring-yellow-400', 'bg-white/20'));
        btn.classList.add('ring-4', 'ring-yellow-400', 'bg-white/20');
        document.getElementById('selected-avatar-val').value = icon;
      },

      async handleOnboardingSubmit(e) {
        e.preventDefault();
        sfx.click();
        const firstName = document.getElementById('ob-firstname').value.trim();
        const lastName = document.getElementById('ob-lastname').value.trim();
        const avatarIcon = document.getElementById('selected-avatar-val').value;
        const dob = document.getElementById('ob-dob').value;
        const gender = document.getElementById('ob-gender').value;
        const country = document.getElementById('ob-country').value;

        try {
          const userRef = window.fbDoc(window.fbDb, "users", window.currentUser.uid);
          await window.fbSetDoc(userRef, {
            firstName,
            lastName,
            avatarIcon,
            dob,
            gender,
            country,
            profileCompleted: true
          }, { merge: true });

          const updatedSnap = await window.fbGetDoc(userRef);
          window.currentUserData = updatedSnap.data();
          this.updateHeader();
          this.navToWelcome();
        } catch (err) {
          alert("Failed to save profile: " + err.message);
        }
      },

      navToWelcome() {
        this.updateHeader();
        const container = document.getElementById('app-container');
        
        const rawGreeting = FUNNY_GREETINGS[Math.floor(Math.random() * FUNNY_GREETINGS.length)];
        const greeting = rawGreeting.replace('{name}', window.currentUserData.firstName || 'Kiddo');
        const fact = FUN_FACTS[Math.floor(Math.random() * FUN_FACTS.length)];

        container.innerHTML = `
          <div class="glass-card w-full max-w-xl p-8 rounded-3xl border border-white/20 text-center shadow-2xl animate-fade-in my-8">
            <div class="text-7xl mb-4 animate-bounce-slow inline-block">${window.currentUserData.avatarIcon || '🐉'}</div>
            
            <h2 class="font-heading text-3xl font-bold text-yellow-300 mb-3">${greeting}</h2>
            
            <div class="bg-gradient-to-r from-purple-900/60 to-pink-900/60 p-5 rounded-2xl border border-pink-500/30 mb-6 text-left relative">
              <span class="text-xs font-bold tracking-wider text-pink-300 uppercase block mb-1">💡 Age-Adapted Fun Fact:</span>
              <p class="text-base font-semibold text-white/90">${fact}</p>
            </div>

            <button onclick="sfx.click(); app.navToDashboard()" class="w-full py-4 bg-gradient-to-r from-yellow-400 via-amber-400 to-orange-500 text-slate-900 font-heading text-xl font-bold rounded-2xl btn-3d hover:brightness-110">
              Go to Headquarters 🚀
            </button>
          </div>
        `;
      },

      navToDashboard() {
        this.updateHeader();
        const container = document.getElementById('app-container');
        const stats = window.currentUserData?.stats || {};
        const rank = calculateRank(stats.highestScore || 0);

        container.innerHTML = `
          <div class="w-full max-w-4xl space-y-6">
            <div class="glass-card p-6 rounded-3xl border border-white/20 flex flex-col md:flex-row items-center justify-between gap-6">
              <div class="flex items-center gap-5">
                <div class="text-6xl p-3 bg-white/10 rounded-2xl border border-white/20 animate-float">${window.currentUserData?.avatarIcon || '🐉'}</div>
                <div>
                  <h2 class="font-heading text-3xl font-bold text-white">${window.currentUserData?.firstName || ''} ${window.currentUserData?.lastName || ''}</h2>
                  <p class="text-sm text-yellow-300 font-bold">@${window.currentUserData?.username || ''} • ${window.currentUserData?.country || 'GLOBAL'}</p>
                  <div class="mt-2 inline-flex items-center gap-2 px-3 py-1 bg-white/10 rounded-full border border-white/20 text-xs font-bold ${rank.class}">
                    <span>Standing:</span> <span>${rank.title}</span> <span>${rank.badge}</span>
                  </div>
                </div>
              </div>

              <div class="flex gap-4 text-center">
                <div class="bg-black/30 py-3 px-5 rounded-2xl border border-white/10">
                  <p class="text-2xl font-bold text-cyan-300 font-heading">${stats.totalSessions || 0}</p>
                  <p class="text-xs text-white/60 font-semibold">Sessions</p>
                </div>
                <div class="bg-black/30 py-3 px-5 rounded-2xl border border-white/10">
                  <p class="text-2xl font-bold text-yellow-400 font-heading">${stats.highestScore || 0}</p>
                  <p class="text-xs text-white/60 font-semibold">Best Score</p>
                </div>
              </div>
            </div>

            <div class="glass-card p-8 rounded-3xl border border-white/20 text-center space-y-4">
              <h3 class="font-heading text-2xl font-bold text-cyan-300">Cognitive Challenge Sequence</h3>
              <p class="text-sm text-white/70 max-w-lg mx-auto">
                Test your working memory and spatial sequence tracking in one continuous run!
              </p>
              
              <button onclick="sfx.click(); app.startSessionSequence()" class="px-10 py-5 bg-gradient-to-r from-green-400 via-emerald-400 to-teal-500 text-slate-900 font-heading text-2xl font-extrabold rounded-2xl btn-3d shadow-xl hover:scale-105 transform transition">
                START CHALLENGE 🎮
              </button>
            </div>
          </div>
        `;
      },

      startSessionSequence() {
        state.currentSessionScore = 0;
        state.activeGameIndex = 0;
        state.gameStats = { game1: { score: 0 }, game2: { score: 0 } };
        this.playGame1();
      },

      playGame1(level = 1) {
        const container = document.getElementById('app-container');
        const digitCount = level + 1;
        const displayTime = 1.0 + (level - 1) * 0.5;
        const inputTime = 3.0 + (level - 1) * 1.0;

        let digits = '';
        for (let i = 0; i < digitCount; i++) {
          digits += Math.floor(Math.random() * 9 + 1).toString();
        }
        const reversedAnswer = digits.split('').reverse().join('');

        container.innerHTML = `
          <div class="glass-card w-full max-w-lg p-8 rounded-3xl border border-white/20 text-center space-y-6">
            <div class="flex justify-between items-center text-xs font-bold text-cyan-300">
              <span>GAME 1: REVERSE DIGITS</span>
              <span>LEVEL ${level}</span>
            </div>

            <p class="text-sm text-white/80">Memorize the digits, then type them in <strong class="text-yellow-300 underline">REVERSE order</strong>!</p>

            <div id="g1-stage" class="min-h-[120px] flex items-center justify-center bg-black/30 rounded-2xl border border-white/10">
              <span id="g1-digits" class="font-heading text-6xl font-extrabold tracking-widest text-yellow-400 animate-pulse-fast">${digits}</span>
            </div>

            <div id="g1-input-zone" class="hidden space-y-4">
              <input id="g1-user-input" type="number" autofocus placeholder="Type reversed digits..." class="w-full text-center text-3xl font-bold py-3 rounded-xl bg-white/10 border border-yellow-400 text-yellow-300 focus:outline-none">
              <div class="w-full bg-white/10 h-2 rounded-full overflow-hidden">
                <div id="g1-timer-bar" class="bg-yellow-400 h-full w-full transition-all duration-100 linear"></div>
              </div>
              <button onclick="app.submitGame1('${reversedAnswer}', ${level})" class="w-full py-3 bg-yellow-400 text-slate-900 font-heading font-bold rounded-xl btn-3d">Submit Answer</button>
            </div>
          </div>
        `;

        setTimeout(() => {
          const digitsEl = document.getElementById('g1-digits');
          const inputZone = document.getElementById('g1-input-zone');
          if (!digitsEl) return;
          
          digitsEl.parentElement.innerHTML = '<span class="text-4xl">❓</span>';
          inputZone.classList.remove('hidden');
          const inputField = document.getElementById('g1-user-input');
          if(inputField) inputField.focus();

          const timerBar = document.getElementById('g1-timer-bar');
          if(timerBar) {
            timerBar.style.transitionDuration = `${inputTime}s`;
            setTimeout(() => timerBar.style.width = '0%', 20);
          }

          state.g1Timer = setTimeout(() => {
            app.submitGame1(reversedAnswer, level, true);
          }, inputTime * 1000);
        }, displayTime * 1000);
      },

      submitGame1(correctReversed, level, isTimeout = false) {
        clearTimeout(state.g1Timer);
        const userInput = document.getElementById('g1-user-input')?.value.trim();

        if (!isTimeout && userInput === correctReversed) {
          sfx.correct();
          const points = level * 20;
          state.currentSessionScore += points;
          state.gameStats.game1.score += points;
          this.playGame1(level + 1);
        } else {
          sfx.wrong();
          this.showDecisionModal({
            gameName: 'Game 1: Reverse Digits',
            score: state.gameStats.game1.score,
            rightAnswer: correctReversed,
            userAnswer: userInput || (isTimeout ? 'Time Expired' : 'Empty'),
            nextAction: () => app.saveAndFinishSession()
          });
        }
      },

      showDecisionModal(data) {
        const container = document.getElementById('app-container');
        container.innerHTML = `
          <div class="glass-card w-full max-w-md p-8 rounded-3xl border border-red-500/30 text-center space-y-6 animate-fade-in">
            <div class="text-6xl">⚠️</div>
            <h3 class="font-heading text-2xl font-bold text-red-400">Round Mistake Detected</h3>
            <p class="text-sm text-white/80">${data.gameName} ended here.</p>

            <div class="bg-black/30 p-4 rounded-2xl border border-white/10 text-left space-y-2 text-sm">
              <div class="flex justify-between"><span class="text-white/60">Your Answer:</span> <span class="text-red-300 font-bold">${data.userAnswer}</span></div>
              <div class="flex justify-between"><span class="text-white/60">Correct Answer:</span> <span class="text-green-300 font-bold">${data.rightAnswer}</span></div>
              <div class="flex justify-between border-t border-white/10 pt-2"><span class="text-white/60">Game Score:</span> <span class="text-yellow-300 font-bold">${data.score} pts</span></div>
            </div>

            <button onclick="sfx.click(); (${data.nextAction.toString()})()" class="w-full py-4 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 font-heading text-xl font-bold rounded-2xl btn-3d hover:brightness-110">
              Save & Finish Session 🏁
            </button>
          </div>
        `;
      },

      async saveAndFinishSession() {
        if (window.currentUser) {
          try {
            const userRef = window.fbDoc(window.fbDb, "users", window.currentUser.uid);
            const userSnap = await window.fbGetDoc(userRef);
            const currentStats = userSnap.data().stats || {};

            const newTotalSessions = (currentStats.totalSessions || 0) + 1;
            const newHighScore = Math.max(currentStats.highestScore || 0, state.currentSessionScore);

            await window.fbSetDoc(userRef, {
              stats: {
                totalSessions: newTotalSessions,
                highestScore: newHighScore
              }
            }, { merge: true });

            await window.fbAddDoc(window.fbCollection(window.fbDb, "sessions"), {
              uid: window.currentUser.uid,
              score: state.currentSessionScore,
              timestamp: window.fbTimestamp()
            });

            const updatedSnap = await window.fbGetDoc(userRef);
            window.currentUserData = updatedSnap.data();
          } catch (err) {
            console.error("Failed to save session:", err);
          }
        }

        const container = document.getElementById('app-container');
        container.innerHTML = `
          <div class="glass-card w-full max-w-md p-8 rounded-3xl border border-white/20 text-center space-y-6 animate-fade-in">
            <div class="text-7xl animate-bounce-slow">🎉</div>
            <h2 class="font-heading text-3xl font-bold text-yellow-300">Challenge Completed!</h2>
            <p class="text-sm text-cyan-200">Fantastic brain training session!</p>

            <div class="bg-black/30 p-6 rounded-2xl border border-white/10">
              <p class="text-xs text-white/60 uppercase font-bold mb-1">Total Session Score</p>
              <p class="font-heading text-5xl font-extrabold text-yellow-400">${state.currentSessionScore}</p>
            </div>

            <button onclick="sfx.click(); app.navToDashboard()" class="w-full py-4 bg-gradient-to-r from-green-400 to-teal-500 text-slate-900 font-heading text-xl font-bold rounded-2xl btn-3d hover:brightness-110">
              Back to Headquarters 🏠
            </button>
          </div>
        `;
      }
    };
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

      getAuth,

      sendPasswordResetEmail, 
      onAuthStateChanged,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      addDoc, 
      getDocs, 
      collection, 
      query, 
      where, 
      orderBy, 
      limit, 
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 🔑 REPLACE WITH YOUR ACTUAL FIREBASE CONFIG KEYS
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAwqb-RlbUQxrIfaROPXhGeLXzPMM9Cnxg",
  authDomain: "mindgames-f116a.firebaseapp.com",
  projectId: "mindgames-f116a",
  storageBucket: "mindgames-f116a.firebasestorage.app",
  messagingSenderId: "296415432842",
  appId: "1:296415432842:web:b97e2e2710f1c75ee89d73",
  measurementId: "G-HC8N4Y4R49"
};
    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    // Bind Firebase methods globally
    window.fbAuth = auth;
    window.fbDb = db;
    window.fbCreateUser = createUserWithEmailAndPassword;
    window.fbSignIn = signInWithEmailAndPassword;
    window.fbSignOut = signOut;
    window.fbResetPassword = sendPasswordResetEmail;
    window.fbUpdateProfile = updateProfile;
    window.fbDoc = doc;
    window.fbGetDoc = getDoc;
    window.fbSetDoc = setDoc;
    window.fbAddDoc = addDoc;
    window.fbGetDocs = getDocs;
    window.fbCollection = collection;
    window.fbQuery = query;
    window.fbWhere = where;
    window.fbOrderBy = orderBy;
    window.fbLimit = limit;
    window.fbTimestamp = serverTimestamp;
    window.fbIncrement = increment;

    // Monitor Auth State safely now that window.app is fully initialized
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        window.currentUser = user;
        try {
          const userDocRef = doc(db, "users", user.uid);
          const userDocSnap = await getDoc(userDocRef);

          if (!userDocSnap.exists() || !userDocSnap.data().profileCompleted) {
            window.app.renderOnboarding();
          } else {
            window.currentUserData = userDocSnap.data();
            window.app.updateHeader();
            window.app.navToWelcome();
          }
        } catch (e) {
          console.error("Auth state update error:", e);
        }
      } else {
        window.currentUser = null;
        window.currentUserData = null;
        document.getElementById('header-profile').classList.add('hidden');
        window.app.renderAuth('signin');
      }
    });
  </script>
