<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CogniShift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  
  <style>
    /* STRICT COLOR PALETTE (Locked) */
    :root {
      --bg-dark: #0f172a;       /* Dark Slate Background */
      --card-bg: #1e293b;       /* Card Surface */
      --card-border: #334155;   /* Subtle Border */
      --primary: #6366f1;       /* Indigo Main Action */
      --primary-hover: #4f46e5;
      --accent: #06b6d4;        /* Cyan Highlights */
      --success: #10b981;       /* Green Match */
      --danger: #ef4444;        /* Red No Match */
      --text-main: #f8fafc;     /* Primary Text */
      --text-muted: #94a3b8;    /* Secondary Text */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }

    /* Container & Cards */
    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .brand-title { font-size: 2rem; font-weight: 800; color: var(--text-main); text-align: center; }
    .brand-subtitle { font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 2rem; }

    /* Screen Management */
    .screen { display: none; }
    .screen.active { display: block; }

    /* Form Controls & Buttons */
    .input-field {
      width: 100%;
      padding: 0.875rem 1rem;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 1.25rem;
      outline: none;
    }
    .input-field:focus { border-color: var(--primary); }

    .btn {
      width: 100%;
      padding: 0.875rem;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--card-border); margin-top: 0.75rem; }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); color: #fff; }

    /* HUD */
    .hud { display: flex; justify-content: space-between; background: #0f172a; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; }
    .hud-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .hud-val { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; font-weight: 700; }

    /* Game Stage */
    .game-target { font-size: 2.75rem; font-weight: 800; text-align: center; margin: 2rem 0; min-height: 60px; }
    .game-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .btn-match { background: var(--success); color: #fff; }
    .btn-no-match { background: var(--danger); color: #fff; }

    /* Leaderboard Table */
    .leader-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    .leader-table th { text-align: left; color: var(--text-muted); padding-bottom: 0.5rem; border-bottom: 1px solid var(--card-border); }
    .leader-table td { padding: 0.75rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .leader-table td:last-child { text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- STEP 1: LOGIN / IDENTITY SCREEN -->
    <div id="screen-login" class="screen active">
      <h1 class="brand-title">CogniShift</h1>
      <p class="brand-subtitle">Enter your profile name to begin</p>
      
      <input type="text" id="username-input" class="input-field" placeholder="Username (e.g., Player1)" maxlength="15">
      <button class="btn btn-primary" onclick="handleLogin()">Continue to Dashboard</button>
    </div>

    <!-- STEP 2: HOMEPAGE / DASHBOARD SCREEN -->
    <div id="screen-home" class="screen">
      <h1 class="brand-title">Dashboard</h1>
      <p class="brand-subtitle">Welcome back, <span id="user-display-name" style="color: var(--accent);"></span>!</p>

      <button class="btn btn-primary" onclick="navigateTo('screen-game'); startNewGame();">Play Stroop Speed Test</button>
      
      <div style="margin-top: 2rem;">
        <h3 style="font-size: 1rem; color: var(--text-main);">Global High Scores</h3>
        <table class="leader-table">
          <thead>
            <tr><th>Rank</th><th>Player</th><th>Score</th></tr>
          </thead>
          <tbody id="leaderboard-body">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>

      <button class="btn btn-secondary" onclick="handleLogout()">Switch Account</button>
    </div>

    <!-- STEP 3: GAME SCREEN -->
    <div id="screen-game" class="screen">
      <div class="hud">
        <div><div class="hud-label">Score</div><div class="hud-val" id="score-val">0</div></div>
        <div><div class="hud-label">Time</div><div class="hud-val" id="time-val" style="color: var(--accent);">30s</div></div>
      </div>

      <p style="text-align: center; color: var(--text-muted); font-size: 0.875rem;">Does text meaning match the ink color?</p>
      <div class="game-target" id="game-target">---</div>

      <div class="game-controls">
        <button class="btn btn-no-match" onclick="submitChoice(false)">No Match</button>
        <button class="btn btn-match" onclick="submitChoice(true)">Match</button>
      </div>

      <button class="btn btn-secondary" onclick="navigateTo('screen-home')" style="margin-top: 1.5rem;">Quit Session</button>
    </div>

  </div>

  <script>
    /* STABLE STATE */
    const COLORS = [
      { name: 'RED', hex: '#ef4444' },
      { name: 'BLUE', hex: '#3b82f6' },
      { name: 'GREEN', hex: '#10b981' },
      { name: 'YELLOW', hex: '#eab308' }
    ];

    let currentUser = localStorage.getItem('cognishift_user') || '';
    let currentScore = 0;
    let timer = 30;
    let timerInterval = null;
    let isMatch = false;

    // Boot Up Check
    window.onload = () => {
      if (currentUser) {
        showDashboard();
      } else {
        navigateTo('screen-login');
      }
    };

    /* NAVIGATION LOGIC */
    function navigateTo(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    /* AUTH LOGIC */
    function handleLogin() {
      const input = document.getElementById('username-input').value.trim();
      if (!input) return alert('Please enter a username.');
      
      currentUser = input;
      localStorage.setItem('cognishift_user', currentUser);
      showDashboard();
    }

    function handleLogout() {
      localStorage.removeItem('cognishift_user');
      currentUser = '';
      navigateTo('screen-login');
    }

    function showDashboard() {
      document.getElementById('user-display-name').textContent = currentUser;
      renderLeaderboard();
      navigateTo('screen-home');
    }

    /* GAME LOGIC */
    function startNewGame() {
      currentScore = 0;
      timer = 30;
      document.getElementById('score-val').textContent = '0';
      document.getElementById('time-val').textContent = '30s';
      
      nextQuestion();

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer--;
        document.getElementById('time-val').textContent = `${timer}s`;
        if (timer <= 0) {
          clearInterval(timerInterval);
          saveScore(currentUser, currentScore);
          alert(`Time's up! Final Score: ${currentScore}`);
          showDashboard();
        }
      }, 1000);
    }

    function nextQuestion() {
      const textObj = COLORS[Math.floor(Math.random() * COLORS.length)];
      const colorObj = COLORS[Math.floor(Math.random() * COLORS.length)];
      
      isMatch = Math.random() < 0.5;
      const targetEl = document.getElementById('game-target');
      
      targetEl.textContent = textObj.name;
      targetEl.style.color = isMatch ? textObj.hex : colorObj.hex;
    }

    function submitChoice(userChoice) {
      if (timer <= 0) return;
      if (userChoice === isMatch) {
        currentScore += 100;
      } else {
        currentScore = Math.max(0, currentScore - 50);
      }
      document.getElementById('score-val').textContent = currentScore;
      nextQuestion();
    }

    /* DATA PERSISTENCE & LEADERBOARD */
    function getScores() {
      return JSON.parse(localStorage.getItem('cognishift_scores') || '[]');
    }

    function saveScore(user, score) {
      const scores = getScores();
      scores.push({ user, score });
      scores.sort((a, b) => b.score - a.score);
      localStorage.setItem('cognishift_scores', JSON.stringify(scores.slice(0, 5)));
    }

    function renderLeaderboard() {
      const scores = getScores();
      const tbody = document.getElementById('leaderboard-body');
      tbody.innerHTML = scores.length ? '' : '<tr><td colspan="3" style="text-align:center; color:var(--text-muted)">No high scores yet</td></tr>';
      
      scores.forEach((s, idx) => {
        tbody.innerHTML += `
          <tr>
            <td>#${idx + 1}</td>
            <td>${escapeHTML(s.user)}</td>
            <td>${s.score}</td>
          </tr>`;
      });
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
