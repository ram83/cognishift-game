<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CogniKids - Professional Brain Gym for Kids</title>
  <!-- Google Fonts & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            nunito: ['Nunito', 'sans-serif'],
          },
          colors: {
            brand: {
              purple: '#7C3AED',
              pink: '#F43F5E',
              yellow: '#F59E0B',
              green: '#10B981',
              blue: '#06B6D4',
              bg: '#0B0F19'
            }
          },
          animation: {
            'bounce-slow': 'bounce 2.5s infinite',
            'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float': 'float 3.5s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-12px)' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b, #090d16, #2d123d);
      min-height: 100vh;
      color: #f8fafc;
      user-select: none;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Fredoka', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }
    .btn-3d {
      transition: all 0.15s ease;
      box-shadow: 0 6px 0 rgba(0,0,0,0.3);
    }
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen overflow-x-hidden">

  <!-- Header Bar -->
  <header class="w-full py-4 px-8 flex justify-between items-center glass-card border-b border-white/10 z-50 sticky top-0">
    <div class="flex items-center gap-3 cursor-pointer" onclick="app.navToDashboard()">
      <div class="text-3xl animate-bounce-slow">🧠</div>
      <span class="font-heading text-2xl font-bold bg-gradient-to-r from-yellow-300 via-pink-400 to-cyan-300 bg-clip-text text-transparent">
        CogniKids Gym
      </span>
    </div>

    <!-- Right Profile Status Widget -->
    <div id="header-profile" class="hidden flex items-center gap-4">
      <div class="flex items-center gap-3 bg-white/10 py-1.5 px-5 rounded-full border border-white/20 shadow-inner">
        <span id="nav-avatar" class="text-2xl animate-float">🐉</span>
        <div>
          <p id="nav-username" class="font-bold text-sm text-yellow-300 leading-tight">Kiddo</p>
          <p id="nav-rank" class="text-xs text-cyan-200 font-semibold">Trainee 🥉</p>
        </div>
      </div>
      <button onclick="app.logout()" class="text-xs text-white/50 hover:text-white underline">Sign Out</button>
    </div>
  </header>

  <!-- Main Container -->
  <main id="app-container" class="flex-grow flex items-center justify-center p-6">
    <!-- Views rendered dynamically -->
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-white/40 tracking-wider">
    CogniKids Professional Cognitive Training Suite &copy; 2026
  </footer>

  <!-- Application Logic & Firebase Integration -->
  <script>
    const TOTAL_ROUNDS = 10;

    const sfx = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playTone(freq, type = 'sine', duration = 0.15) {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      },
      correct() {
        this.playTone(523.25, 'triangle', 0.12);
        setTimeout(() => this.playTone(659.25, 'triangle', 0.12), 120);
        setTimeout(() => this.playTone(783.99, 'triangle', 0.25), 240);
      },
      wrong() {
        this.playTone(200, 'sawtooth', 0.2);
        setTimeout(() => this.playTone(150, 'sawtooth', 0.3), 150);
      },
      click() {
        this.playTone(440, 'sine', 0.05);
      }
    };

    const AVATARS = [
      { id: 'dragon', name: 'Dragon', icon: '🐉' },
      { id: 'mermaid', name: 'Mermaid', icon: '🧜‍♀️' },
      { id: 'dolphin', name: 'Dolphin', icon: '🐬' },
      { id: 'ram', name: 'Ram', icon: '🐏' },
      { id: 'lion', name: 'Lion', icon: '🦁' },
      { id: 'bear', name: 'Bear', icon: '🐻' },
      { id: 'tiger', name: 'Tiger', icon: '🐯' },
      { id: 'unicorn', name: 'Unicorn', icon: '🦄' },
      { id: 'dog', name: 'Dog', icon: '🐶' },
      { id: 'cat', name: 'Cat', icon: '🐱' },
      { id: 'python', name: 'Python', icon: '🐍' },
      { id: 'phoenix', name: 'Phoenix', icon: '🦅' }
    ];

    const FUN_FACTS = [
      "Octopuses have three hearts and blue blood! 🐙",
      "Honey never spoils. Yummy 3,000-year-old honey is edible! 🍯",
      "A day on Venus is longer than a year on Venus! 🪐",
      "Bananas are naturally slightly radioactive! 🍌",
      "Dolphins give each other individual names with whistles! 🐬",
      "Your brain uses 20% of all the energy in your body! 🧠",
      "Cows have best friends and get stressed when separated! 🐮",
      "Sharks existed before trees were on Earth! 🦈"
    ];

    const FUNNY_GREETINGS = [
      "Welcome back, Captain {name}! Ready for your cognitive workout?",
      "Hey {name}! Your brain neurons are primed and ready for action!",
      "Greetings, Mastermind {name}! Let's set some new high scores today!",
      "Look who's back! The legendary {name} is ready to train!"
    ];

    const state = {
      currentSessionScore: 0,
      currentGameId: 1,
      currentLevel: 1,
      activeTimer: null,
      g3State: {},
      g4State: {},
      g6State: {},
      g8State: {},
      g9State: {},
      g10State: {},
      roundMetrics: {}
    };

    function calculateRank(highScore) {
      if (highScore >= 1200) return { title: 'Master Mind', badge: '🏆', class: 'text-amber-300' };
      if (highScore >= 800) return { title: 'Genius', badge: '🥇', class: 'text-yellow-400' };
      if (highScore >= 400) return { title: 'Sharp', badge: '🥈', class: 'text-cyan-300' };
      return { title: 'Trainee', badge: '🥉', class: 'text-slate-300' };
    }

    window.app = {
      logout() {
        if (window.fbSignOut && window.fbAuth) {
          window.fbSignOut(window.fbAuth);
        }
      },

      updateHeader() {
        const profileEl = document.getElementById('header-profile');
        if (!window.currentUserData) {
          profileEl.classList.add('hidden');
          return;
        }
        profileEl.classList.remove('hidden');
        document.getElementById('nav-avatar').textContent = window.currentUserData.avatarIcon || '🐉';
        document.getElementById('nav-username').textContent = window.currentUserData.firstName || window.currentUserData.username || 'Kiddo';
        
        const stats = window.currentUserData.stats || {};
        const rank = calculateRank(stats.highestScore || 0);
        document.getElementById('nav-rank').textContent = `${rank.title} ${rank.badge}`;
      },

      renderAuth(mode = 'signin') {
        const container = document.getElementById('app-container');
        container.innerHTML = `
          <div class="glass-card w-full max-w-md p-8 rounded-3xl border border-white/20 shadow-2xl">
            <div class="text-center mb-6">
              <h2 class="font-heading text-3xl font-bold text-yellow-300 mb-2">
                ${mode === 'signin' ? 'Welcome Back!' : mode === 'signup' ? 'Create Account' : 'Reset Password'}
              </h2>
              <p class="text-sm text-cyan-200">
                ${mode === 'signin' ? 'Sign in to access your brain training gym.' : mode === 'signup' ? 'Join CogniKids and start your cognitive journey.' : 'Enter your email to recover your account.'}
              </p>
            </div>

            ${mode !== 'forgot' ? `
            <div class="flex bg-white/10 p-1 rounded-2xl mb-6">
              <button onclick="sfx.click(); app.renderAuth('signin')" class="flex-1 py-2 rounded-xl text-sm font-bold transition-all ${mode === 'signin' ? 'bg-brand-purple text-white shadow-lg' : 'text-white/60 hover:text-white'}">Sign In</button>
              <button onclick="sfx.click(); app.renderAuth('signup')" class="flex-1 py-2 rounded-xl text-sm font-bold transition-all ${mode === 'signup' ? 'bg-brand-purple text-white shadow-lg' : 'text-white/60 hover:text-white'}">Sign Up</button>
            </div>
            ` : ''}

            <form onsubmit="app.handleAuthSubmit(event, '${mode}')" class="space-y-4">
              ${mode === 'signup' ? `
              <div>
                <label class="block text-xs font-bold text-white/80 mb-1">Unique Username</label>
                <input id="auth-username" type="text" required placeholder="Choose a unique handle" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
              </div>
              ` : ''}

              <div>
                <label class="block text-xs font-bold text-white/80 mb-1">Email Address</label>
                <input id="auth-email" type="email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
              </div>

              <div>
                <label class="block text-xs font-bold text-white/80 mb-1">Password</label>
                <input id="auth-password" type="password" ${mode !== 'forgot' ? 'required' : ''} placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
              </div>

              ${mode === 'signin' ? `
              <div class="text-right">
                <button type="button" onclick="app.renderAuth('forgot')" class="text-xs text-yellow-300 hover:underline">Forgot Password?</button>
              </div>
              ` : ''}

              <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-900 font-heading text-lg font-bold rounded-xl btn-3d hover:brightness-110">
                ${mode === 'signin' ? 'Sign In 🚀' : mode === 'signup' ? 'Continue to Onboarding 🎨' : 'Send Reset Link 📧'}
              </button>
            </form>

            <div id="auth-status" class="mt-4 text-center text-xs"></div>

            ${mode === 'forgot' ? `
            <div class="text-center mt-4">
              <button onclick="app.renderAuth('signin')" class="text-xs text-cyan-300 hover:underline">← Back to Sign In</button>
            </div>
            ` : ''}
          </div>
        `;
      },

      async handleAuthSubmit(e, mode) {
        e.preventDefault();
        sfx.click();
        const email = document.getElementById('auth-email').value.trim();
        const password = document.getElementById('auth-password').value;
        const statusEl = document.getElementById('auth-status');

        try {
          if (mode === 'signup') {
            const username = document.getElementById('auth-username').value.trim().toLowerCase();
            if (username.length < 3) {
              statusEl.textContent = "Username must be at least 3 characters.";
              statusEl.className = "mt-4 text-center text-xs text-red-400";
              return;
            }

            const usernameRef = window.fbDoc(window.fbDb, "usernames", username);
            const usernameSnap = await window.fbGetDoc(usernameRef);
            if (usernameSnap.exists()) {
              statusEl.textContent = "Username is already taken.";
              statusEl.className = "mt-4 text-center text-xs text-red-400";
              return;
            }

            const userCred = await window.fbCreateUser(window.fbAuth, email, password);
            await window.fbUpdateProfile(userCred.user, { displayName: username });

            await window.fbSetDoc(usernameRef, { uid: userCred.user.uid });
            await window.fbSetDoc(window.fbDoc(window.fbDb, "users", userCred.user.uid), {
              username: username,
              email: email,
              profileCompleted: false,
              createdAt: window.fbTimestamp(),
              stats: { totalSessions: 0, highestScore: 0 }
            });
          } else if (mode === 'signin') {
            await window.fbSignIn(window.fbAuth, email, password);
          } else {
            await window.fbResetPassword(window.fbAuth, email);
            statusEl.textContent = "Reset link dispatched. Check your inbox.";
            statusEl.className = "mt-4 text-center text-xs text-green-400";
          }
        } catch (err) {
          statusEl.textContent = err.message.replace("Firebase: ", "");
          statusEl.className = "mt-4 text-center text-xs text-red-400";
        }
      },

      renderOnboarding() {
        const container = document.getElementById('app-container');
        container.innerHTML = `
          <div class="glass-card w-full max-w-xl p-8 rounded-3xl border border-white/20 shadow-2xl my-8">
            <h2 class="font-heading text-3xl font-bold text-center text-yellow-300 mb-2">Profile Setup 🎉</h2>
            <p class="text-center text-sm text-cyan-200 mb-6">Customize your profile to kickstart your cognitive journey.</p>

            <form onsubmit="app.handleOnboardingSubmit(event)" class="space-y-6">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">First Name</label>
                  <input id="ob-firstname" type="text" required placeholder="Alex" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">Last Name</label>
                  <input id="ob-lastname" type="text" required placeholder="Smith" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-white/80 mb-2">Choose Your Avatar Companion</label>
                <div class="grid grid-cols-4 sm:grid-cols-6 gap-3 max-h-48 overflow-y-auto p-2 bg-black/20 rounded-2xl border border-white/10">
                  ${AVATARS.map((a, i) => `
                    <button type="button" onclick="app.selectAvatar('${a.icon}', this)" class="avatar-opt p-3 text-3xl rounded-xl border border-white/10 bg-white/5 hover:bg-white/20 transition-all ${i === 0 ? 'ring-4 ring-yellow-400 bg-white/20' : ''}">
                      ${a.icon}
                    </button>
                  `).join('')}
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">Date of Birth</label>
                  <input id="ob-dob" type="date" required class="w-full px-3 py-3 rounded-xl bg-white/10 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">Gender</label>
                  <select id="ob-gender" required class="w-full px-3 py-3 rounded-xl bg-slate-800 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="Boy">Boy</option>
                    <option value="Girl">Girl</option>
                    <option value="Non-binary">Non-binary</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-white/80 mb-1">Country</label>
                  <select id="ob-country" required class="w-full px-3 py-3 rounded-xl bg-slate-800 border border-white/20 text-white focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="USA">United States</option>
                    <option value="UK">United Kingdom</option>
                    <option value="Canada">Canada</option>
                    <option value="Australia">Australia</option>
                    <option value="India">India</option>
                    <option value="South Korea">South Korea</option>
                    <option value="Japan">Japan</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
              </div>

              <input type="hidden" id="selected-avatar-val" value="${AVATARS[0].icon}">

              <button type="submit" class="w-full py-4 bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-900 font-heading text-xl font-bold rounded-2xl btn-3d hover:brightness-110">
                Save & Continue 🌟
              </button>
            </form>
          </div>
        `;
      },

      selectAvatar(icon, btn) {
        sfx.click();
        document.querySelectorAll('.avatar-opt').forEach(b => b.classList.remove('ring-4', 'ring-yellow-400', 'bg-white/20'));
        btn.classList.add('ring-4', 'ring-yellow-400', 'bg-white/20');
        document.getElementById('selected-avatar-val').value = icon;
      },

      async handleOnboardingSubmit(e) {
        e.preventDefault();
        sfx.click();
        const firstName = document.getElementById('ob-firstname').value.trim();
        const lastName = document.getElementById('ob-lastname').value.trim();
        const avatarIcon = document.getElementById('selected-avatar-val').value;
        const dob = document.getElementById('ob-dob').value;
        const gender = document.getElementById('ob-gender').value;
        const country = document.getElementById('ob-country').value;

        try {
          const userRef = window.fbDoc(window.fbDb, "users", window.currentUser.uid);
          await window.fbSetDoc(userRef, {
            firstName,
            lastName,
            avatarIcon,
            dob,
            gender,
            country,
            profileCompleted: true
          }, { merge: true });

          const updatedSnap = await window.fbGetDoc(userRef);
          window.currentUserData = updatedSnap.data();
          this.updateHeader();
          this.navToWelcome();
        } catch (err) {
          alert("Failed to save profile: " + err.message);
        }
      },

      navToWelcome() {
        this.updateHeader();
        const container = document.getElementById('app-container');
        
        const rawGreeting = FUNNY_GREETINGS[Math.floor(Math.random() * FUNNY_GREETINGS.length)];
        const greeting = rawGreeting.replace('{name}', window.currentUserData.firstName || 'Kiddo');
        const fact = FUN_FACTS[Math.floor(Math.random() * FUN_FACTS.length)];

        container.innerHTML = `
          <div class="glass-card w-full max-w-xl p-8 rounded-3xl border border-white/20 text-center shadow-2xl animate-fade-in my-8 space-y-6">
            <div class="text-7xl mb-2 animate-bounce-slow inline-block">${window.currentUserData.avatarIcon || '🐉'}</div>
            
            <h2 class="font-heading text-3xl font-bold text-yellow-300">${greeting}</h2>
            
            <div class="bg-gradient-to-r from-purple-900/60 to-pink-900/60 p-5 rounded-2xl border border-pink-500/35 text-left relative">
              <span class="text-xs font-bold tracking-wider text-pink-300 uppercase block mb-1">💡 Brain Fun Fact:</span>
              <p class="text-base font-semibold text-white/90">${fact}</p>
            </div>

            <button onclick="sfx.click(); app.navToDashboard()" class="w-full py-4 bg-gradient-to-r from-yellow-400 via-amber-400 to-orange-500 text-slate-900 font-heading text-xl font-bold rounded-2xl btn-3d hover:brightness-110 shadow-lg">
              Enter Training Gym 🚀
            </button>
          </div>
        `;
      },

      navToDashboard() {
        this.updateHeader();
        const container = document.getElementById('app-container');
        const stats = window.currentUserData?.stats || {};
        const rank = calculateRank(stats.highestScore || 0);

        container.innerHTML = `
          <div class="w-full max-w-4xl space-y-6">
            <div class="glass-card p-8 rounded-3xl border border-white/20 flex flex-col md:flex-row items-center justify-between gap-6">
              <div class="flex items-center gap-6">
                <div class="text-7xl p-4 bg-white/10 rounded-2xl border border-white/20 animate-float shadow-inner">${window.currentUserData?.avatarIcon || '🐉'}</div>
                <div>
                  <h2 class="font-heading text-3xl font-bold text-white">${window.currentUserData?.firstName || ''} ${window.currentUserData?.lastName || ''}</h2>
                  <p class="text-sm text-yellow-300 font-bold">@${window.currentUserData?.username || ''} • ${window.currentUserData?.country || 'GLOBAL'}</p>
                  <div class="mt-3 inline-flex items-center gap-2 px-4 py-1.5 bg-white/10 rounded-full border border-white/20 text-xs font-bold ${rank.class}">
                    <span>Rank:</span> <span>${rank.title}</span> <span>${rank.badge}</span>
                  </div>
                </div>
              </div>

              <div class="flex gap-4 text-center">
                <div class="bg-black/30 py-4 px-6 rounded-2xl border border-white/10 shadow-inner">
                  <p class="text-3xl font-bold text-cyan-300 font-heading">${stats.totalSessions || 0}</p>
                  <p class="text-xs text-white/60 font-semibold tracking-wide">Sessions</p>
                </div>
                <div class="bg-black/30 py-4 px-6 rounded-2xl border border-white/10 shadow-inner">
                  <p class="text-3xl font-bold text-yellow-400 font-heading">${stats.highestScore || 0}</p>
                  <p class="text-xs text-white/60 font-semibold tracking-wide">Best Score</p>
                </div>
              </div>
            </div>

            <div class="glass-card p-10 rounded-3xl border border-white/20 text-center space-y-6">
              <h3 class="font-heading text-3xl font-bold text-yellow-300">Cognitive Circuit Challenge (10 Rounds)</h3>
              <p class="text-base text-white/80 max-w-xl mx-auto leading-relaxed">
                Progress through 10 comprehensive rounds spanning working memory, attention, spatial reasoning, mathematics, agility, and cognitive flexibility. Each level ramps up difficulty until you make a mistake!
              </p>
              
              <button onclick="sfx.click(); app.startSessionSequence()" class="px-12 py-5 bg-gradient-to-r from-green-400 via-emerald-400 to-teal-500 text-slate-900 font-heading text-2xl font-extrabold rounded-2xl btn-3d shadow-2xl hover:scale-105 transform transition">
                START TRAINING CIRCUIT 🎮
              </button>
            </div>
          </div>
        `;
      },

      startSessionSequence() {
        state.currentSessionScore = 0;
        state.currentGameId = 1;
        state.currentLevel = 1;
        state.roundMetrics = {};
        this.showTutorial(1);
      },

      // --- TUTORIAL & DEMO SYSTEM (10 Rounds) ---
      showTutorial(gameId) {
        state.currentGameId = gameId;
        state.currentLevel = 1;
        const container = document.getElementById('app-container');

        const tutorials = {
          1: {
            title: "Round 1: Reverse Digits",
            desc: "Watch the numbers flash. Type them in **reverse order** and press **Enter**! (e.g. 10 ➔ 01). Difficulty ramps up each level.",
            demoHTML: `
              <div class="flex items-center justify-center gap-3 py-6">
                <span class="px-4 py-3 bg-yellow-400/20 border border-yellow-400 rounded-xl text-2xl font-bold text-yellow-300 animate-pulse">1</span>

      loadGame(gameId, level) {
        state.currentGameId = gameId;
        state.currentLevel = level;
        if(gameId === 1) this.playGame1(level);
        else if(gameId === 2) this.playGame2(level);
        else if(gameId === 3) this.playGame3(level);
        else if(gameId === 4) this.playGame4(level);
        else if(gameId === 5) this.playGame5(level);
        else if(gameId === 6) this.playGame6(level);
        else if(gameId === 7) this.playGame7(level);
        else if(gameId === 8) this.playGame8(level);
        else if(gameId === 9) this.playGame9(level);
        else if(gameId === 10) this.playGame10(level);
        else this.saveAndFinishSession();
      },

      // --- GAME 1: REVERSE DIGITS ---
      playGame1(level = 1) {
        const container = document.getElementById('app-container');
        const digitCount = Math.min(1 + level, 8);
        const displayTime = 3.0 + (level * 0.5);
        const inputTime = 12.0 + (level * 1.5);

        let digits = '';
        for (let i = 0; i < digitCount; i++) {
          digits += Math.floor(Math.random() * 9 + 1).toString();
        }
        const reversedAnswer = digits.split('').reverse().join('');

        container.innerHTML = `
          <div class="glass-card w-full max-w-lg p-8 rounded-3xl border border-white/20 text-center space-y-6">
            <div class="flex justify-between items-center text-xs font-bold text-cyan-300">
              <span>ROUND 1: REVERSE DIGITS</span>
              <span>LEVEL ${level} (${digitCount} Digits)</span>
            </div>

            <p class="text-sm text-white/80">Memorize digits, type in <strong class="text-yellow-300 underline">REVERSE order</strong> & press <kbd class="px-2 py-1 bg-white/10 rounded border border-white/20 text-xs">Enter</kbd>!</p>

            <div id="g1-stage" class="min-h-[125px] flex items-center justify-center bg-black/30 rounded-2xl border border-white/10 shadow-inner">
              <span id="g1-digits" class="font-heading text-6xl font-extrabold tracking-widest text-yellow-400 animate-pulse">${digits}</span>
            </div>

            <div id="g1-input-zone" class="hidden space-y-4">
              <input id="g1-user-input" type="number" autofocus placeholder="Type reversed digits & press Enter" onkeydown="if(event.key==='Enter') app.submitGame1('${reversedAnswer}', ${level})" class="w-full text-center text-3xl font-bold py-3.5 rounded-xl bg-white/10 border border-yellow-400 text-yellow-300 focus:outline-none shadow-inner">
              <div class="w-full bg-white/10 h-2.5 rounded-full overflow-hidden">
                <div id="g1-timer-bar" class="bg-yellow-400 h-full w-full transition-all duration-100 linear"></div>
              </div>
              <button onclick="app.submitGame1('${reversedAnswer}', ${level})" class="w-full py-3.5 bg-yellow-400 text-slate-900 font-heading font-bold rounded-xl btn-3d">Submit Answer</button>
            </div>
          </div>
        `;

        setTimeout(() => {
          const digitsEl = document.getElementById('g1-digits');
          const inputZone = document.getElementById('g1-input-zone');
          if (!digitsEl) return;
          
          digitsEl.parentElement.innerHTML = '<span class="text-4xl">❓</span>';
          inputZone.classList.remove('hidden');
          const inputField = document.getElementById('g1-user-input');
          if(inputField) inputField.focus();

          const timerBar = document.getElementById('g1-timer-bar');
          if(timerBar) {
            timerBar.style.transitionDuration = `${inputTime}s`;
            setTimeout(() => timerBar.style.width = '0%', 30);
          }

          state.activeTimer = setTimeout(() => {
            app.submitGame1(reversedAnswer, level, true);
          }, inputTime * 1000);
        }, displayTime * 1000);
      },

      submitGame1(correctReversed, level, isTimeout = false) {
        clearTimeout(state.activeTimer);
        const userInput = document.getElementById('g1-user-input')?.value.trim();

        if (!isTimeout && userInput === correctReversed) {
          sfx.correct();
          state.currentSessionScore += level * 20;
          this.loadGame(1, level + 1);
        } else {
          sfx.wrong();
          this.recordRoundMetric(1, level, false);
          this.showDecisionModal({
            gameName: 'Round 1: Reverse Digits',
            score: state.currentSessionScore,
            rightAnswer: correctReversed,
            userAnswer: userInput || (isTimeout ? 'Time Expired' : 'Empty'),
            nextGameId: 2
          });
        }
      },

      // --- GAME 2: COLOR MATCH REACTION (Reduced Time & Strictness) ---
      playGame2(level = 1) {
        const container = document.getElementById('app-container');
        // Progressive time reduction: starts at 4.5s and speeds up to 2.0s
        const timeLimit = Math.max(2.0, 5.0 - (level * 0.3));

        const colors = [
          { name: 'RED', class: 'text-red-400' },
          { name: 'BLUE', class: 'text-cyan-400' },
          { name: 'GREEN', class: 'text-emerald-400' },
          { name: 'YELLOW', class: 'text-yellow-400' },
          { name: 'PURPLE', class: 'text-purple-400' }
        ];

        const targetColor = colors[Math.floor(Math.random() * colors.length)];
        const displayColor = colors[Math.floor(Math.random() * colors.length)];
        const isMatch = targetColor.name === displayColor.name;

        container.innerHTML = `
          <div class="glass-card w-full max-w-lg p-8 rounded-3xl border border-white/20 text-center space-y-6">
            <div class="flex justify-between items-center text-xs font-bold text-cyan-300">
              <span>ROUND 2: COLOR MATCH</span>
              <span>LEVEL ${level} (${timeLimit.toFixed(1)}s limit)</span>
            </div>

            <p class="text-sm text-white/80">Does the <strong class="text-yellow-300">INK COLOR</strong> match the word text?</p>

            <div class="min-h-[140px] flex items-center justify-center bg-black/30 rounded-2xl border border-white/10 shadow-inner">

            </div>

            <div class="grid grid-cols-2 gap-4">
              <button onclick="app.submitGame2(true, ${isMatch}, ${level})" class="py-4 bg-emerald-500/25 hover:bg-emerald-500/40 border border-emerald-400 text-emerald-300 font-heading text-lg font-bold rounded-2xl btn-3d">YES ✔️</button>
              <button onclick="app.submitGame2(false, ${isMatch}, ${level})" class="py-4 bg-rose-500/25 hover:bg-rose-500/40 border border-rose-400 text-rose-300 font-heading text-lg font-bold rounded-2xl btn-3d">NO ✖️</button>
            </div>

            <div class="w-full bg-white/10 h-2.5 rounded-full overflow-hidden">
              <div id="g2-timer-bar" class="bg-cyan-400 h-full w-full transition-all duration-100 linear"></div>
            </div>
          </div>

        const timerBar = document.getElementById('g2-timer-bar');
        if (timerBar) {
          timerBar.style.transitionDuration = `${timeLimit}s`;

        }

        state.activeTimer = setTimeout(() => {
          app.submitGame2(null, isMatch, level, true);
        }, timeLimit * 1000);
      },

      submitGame2(userChoice, correctMatch, level, isTimeout = false) {
        clearTimeout(state.activeTimer);

        if (!isTimeout && userChoice === correctMatch) {
          sfx.correct();
          state.currentSessionScore += level * 25;
          this.loadGame(2, level + 1);
        } else {
          sfx.wrong();
          this.recordRoundMetric(2, level, false);
          this.showDecisionModal({
            gameName: 'Round 2: Color Match',
            score: state.currentSessionScore,
            rightAnswer: correctMatch ? 'YES' : 'NO',
            userAnswer: isTimeout ? 'Time Expired' : (userChoice ? 'YES' : 'NO'),
            nextGameId: 3
          });
        }
      },

      // --- GAME 3: PATTERN MATRIX ---
      playGame3(level = 1) {
        const container = document.getElementById('app-container');
        const gridSize = level <= 3 ? 3 : 4;
        const tileCount = Math.min(2 + level, 10);

        let sequence = [];
        while(sequence.length < tileCount) {
          let rand = Math.floor(Math.random() * (gridSize * gridSize));
          if(!sequence.includes(rand)) sequence.push(rand);
        }

        state.g3State = { gridSize, sequence, userIndex: 0, level };

        container.innerHTML = `
          <div class="glass-card w-full max-w-lg p-8 rounded-3xl border border-white/20 text-center space-y-6">
            <div class="flex justify-between items-center text-xs font-bold text-cyan-300">
              <span>ROUND 3: PATTERN MATRIX</span>
              <span>LEVEL ${level} (${tileCount} Tiles)</span>
            </div>

            <p class="text-sm text-white/80">Watch the flashing pattern carefully...</p>

            <div id="g3-grid" class="grid grid-cols-${gridSize} gap-3 max-w-xs mx-auto p-4 bg-black/30 rounded-2xl border border-white/10 shadow-inner">
              ${Array.from({length: gridSize * gridSize}).map((_, i) => `
                <div id="g3-tile-${i}" class="aspect-square bg-white/10 rounded-xl border border-white/20 transition-all"></div>
              `).join('')}
            </div>
            <p id="g3-status" class="text-xs font-bold text-yellow-300 animate-pulse">Memorizing pattern...</p>
          </div>
        `;

        sequence.forEach((tileIdx, idx) => {
          setTimeout(() => {
            sfx.playTone(320 + idx * 80, 'sine', 0.3);
            const tile = document.getElementById(`g3-tile-${tileIdx}`);
            if(tile) tile.classList.add('bg-yellow-400', 'scale-105', 'shadow-lg');
            setTimeout(() => {
              if(tile) tile.classList.remove('bg-yellow-400', 'scale-105', 'shadow-lg');
            }, 750);
          }, (idx + 1) * 1050);
        });

        setTimeout(() => {
          const statusEl = document.getElementById('g3-status');
          if(statusEl) statusEl.textContent = "Your turn! Click tiles in order.";
          
          const gridEl = document.getElementById('g3-grid');
          gridEl.innerHTML = `
            ${Array.from({length: gridSize * gridSize}).map((_, i) => `
              <button onclick="app.submitGame3Tile(${i})" id="g3-tile-${i}" class="aspect-square bg-white/10 hover:bg-white/20 rounded-xl border border-white/20 transition-all btn-3d"></button>
            `).join('')}
          `;
        }, (sequence.length + 1) * 1050);
      },

      submitGame3Tile(tileIdx) {
        sfx.click();
        const correctTile = state.g3State.sequence[state.g3State.userIndex];
        const tileEl = document.getElementById(`g3-tile-${tileIdx}`);

        if(tileIdx === correctTile) {
          tileEl.classList.add('bg-emerald-400');
          setTimeout(() => tileEl.classList.remove('bg-emerald-400'), 250);
          state.g3State.userIndex++;

          if(state.g3State.userIndex === state.g3State.sequence.length) {
            sfx.correct();
            state.currentSessionScore += state.g3State.level * 30;
            this.loadGame(3, state.g3State.level + 1);
          }
        } else {
          sfx.wrong();
          tileEl.classList.add('bg-rose-500');
          this.recordRoundMetric(3, state.g3State.level, false);
          this.showDecisionModal({
            gameName: 'Round 3: Pattern Matrix',
            score: state.currentSessionScore,
            rightAnswer: 'Complete sequence',
            userAnswer: 'Wrong tile clicked',
            nextGameId: 4
          });
        }
      },

      // --- GAME 4: SPATIAL MAZE ---
      playGame4(level = 1) {
        const container = document.getElementById('app-container');
        const size = 3; 
        const pathLen = Math.min(3 + level, 8); 

        let path = [{r: 0, c: 0}];
        let curr = {r: 0, c: 0};
        while(path.length < pathLen) {
          const neighbors = [
            {r: curr.r + 1, c: curr.c},
            {r: curr.r, c: curr.c + 1}
          ].filter(n => n.r < size && n.c < size);
          if(neighbors.length === 0) break;
          curr = neighbors[Math.floor(Math.random() * neighbors.length)];
          path.push(curr);
        }

        const target = path[path.length - 1];
        state.g4State = { size, path, target, currentStep: 0, level };

        container.innerHTML = `
          <div class="glass-card w-full max-w-lg p-8 rounded-3xl border border-white/20 text-center space-y-6">
            <div class="flex justify-between items-center text-xs font-bold text-cyan-300">
              <span>ROUND 4: SPATIAL MAZE</span>
              <span>LEVEL ${level}</span>
            </div>

            <p class="text-sm text-white/80">Navigate from <strong class="text-emerald-300">Start (🟩)</strong> to <strong class="text-yellow-300">Goal (⭐)</strong> step-by-step!</p>

            <div class="grid grid-cols-3 gap-3 max-w-xs mx-auto p-4 bg-black/30 rounded-2xl border border-white/10 shadow-inner">
              ${Array.from({length: size * size}).map((_, i) => {
                const r = Math.floor(i / size);
                const c = i % size;
                const isStart = r === 0 && c === 0;
                const isGoal = r === target.r && c === target.c;
                return `
                  <button onclick="app.submitGame4Step(${r}, ${c})" id="g4-${r}-${c}" class="aspect-square flex items-center justify-center text-2xl bg-white/10 hover:bg-white/20 rounded-xl border border-white/20 transition-all btn-3d">
                    ${isStart ? '🟩' : isGoal ? '⭐' : '·'}
                  </button>
                `;
              }).join('')}
            </div>
            <p class="text-xs text-white/60">Click adjacent connected cells correctly.</p>
          </div>
        `;
      },

      submitGame4Step(r, c) {
        sfx.click();
        const expected = state.g4State.path[state.g4State.currentStep];
        const cellEl = document.getElementById(`g4-${r}-${c}`);

        if(r === expected.r && c === expected.c) {
          cellEl.textContent = '✔️';
          cellEl.classList.add('bg-emerald-500/30', 'border-emerald-400');
          state.g4State.currentStep++;

          if(state.g4State.currentStep === state.g4State.path.length) {
            sfx.correct();
            state.currentSessionScore += state.g4State.level * 35;
            this.loadGame(4, state.g4State.level + 1);
          }
        } else {
          sfx.wrong();
          cellEl.textContent = '❌';
          cellEl.classList.add('bg-rose-500/30', 'border-rose-400');
          this.recordRoundMetric(4, state.g4State.level, false);
          this.showDecisionModal({
            gameName: 'Round 4: Spatial Maze',
            score: state.currentSessionScore,
            rightAnswer: 'Correct path sequence',
            userAnswer: `Wrong cell (${r},${c})`,
            nextGameId: 5
          });
        }
      },

      // --- GAME 5: SPEED MATH BLITZ (Rampant Progressive Difficulty) ---
      playGame5(level = 1) {
        const container = document.getElementById('app-container');
        const timeLimit = Math.max(6.0, 14.0 - (level * 0.8));

        let eqText = '';
        let correctAnswer = 0;

        // Progressive difficulty branching across levels
        if (level === 1) {
          let a = Math.floor(Math.random() * 8) + 2;
          let b = Math.floor(Math.random() * 8) + 2;
          eqText = `${a} + ${b}`;
          correctAnswer = a + b;
        } else if (level === 2) {
          let a = Math.floor(Math.random() * 12) + 5;
          let b = Math.floor(Math.random() * 8) + 2;
          eqText = `${a} - ${b}`;
          correctAnswer = a - b;
        } else if (level === 3) {
          let a = Math.floor(Math.random() * 8) + 2;
          let b = Math.floor(Math.random() * 6) + 2;
          let c = Math.floor(Math.random() * 5) + 1;
          eqText = `${a} × ${b} + ${c}`;
          correctAnswer = (a * b) + c;
        } else if (level === 4) {
          let a = Math.floor(Math.random() * 20) + 10;
          let b = Math.floor(Math.random() * 10) + 5;
          let c = Math.floor(Math.random() * 8) + 2;
          eqText = `${a} + ${b} - ${c}`;
          correctAnswer = a + b - c;
        } else if (level === 5) {
          let a = Math.floor(Math.random() * 9) + 2;
          let b = Math.floor(Math.random() * 9) + 2;
          let c = Math.floor(Math.random() * 10) + 1;
          eqText = `(${a} + ${b}) × ${c}`;
          correctAnswer = (a + b) * c;
        } else {
          // High levels: double digits with mixed operators & division factors
          let mult = Math.floor(Math.random() * 8) + 3;
          let base = mult * (Math.floor(Math.random() * 6) + 2);
          let add = Math.floor(Math.random() * 15) + 5;
          eqText = `${base} ÷ ${mult} + ${add}`;
          correctAnswer = (base / mult) + add;
        }

        let choices = [correctAnswer];
        while(choices.length < 3) {
          let offset = (Math.floor(Math.random() * 8) - 4) * (level > 3 ? 2 : 1);
          if (offset === 0) offset = 1;
          let distractor = correctAnswer + offset;
          if(distractor !== correctAnswer && !choices.includes(distractor) && distractor >= 0) {
            choices.push(distractor);
          }
        }
        choices.sort(() => Math.random() - 0.5);

        container.innerHTML = `
          <div class="glass-card w-full max-w-lg p-8 rounded-3xl border border-white/20 text-center space-y-6">
            <div class="flex justify-between items-center text-xs font-bold text-cyan-300">
              <span>ROUND 5: SPEED MATH BLITZ</span>
              <span>LEVEL ${level} (Advanced Logic)</span>
            </div>

            <p class="text-sm text-white/80">Solve the complex equation before time runs out!</p>

            <div class="min-h-[125px] flex items-center justify-center bg-black/30 rounded-2xl border border-white/10 shadow-inner">
              <span class="font-heading text-4xl sm:text-5xl font-extrabold text-yellow-300">${eqText} = ?</span>
            </div>

            <div class="grid grid-cols-3 gap-4">
              ${choices.map(ans => `
                <button onclick="app.submitGame5(${ans}, ${correctAnswer}, ${level})" class="py-4 bg-white/10 hover:bg-white/20 border border-white/20 text-white font-heading text-2xl font-bold rounded-2xl btn-3d shadow-inner">${ans}</button>
              `).join('')}

  <!-- FIREBASE SDKs & Auth Listener -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      sendPasswordResetEmail, 
      onAuthStateChanged,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      addDoc, 
      getDocs, 
      collection, 
      query, 
      where, 
      orderBy, 
      limit, 
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
  apiKey: "AIzaSyAwqb-RlbUQxrIfaROPXhGeLXzPMM9Cnxg",
  authDomain: "mindgames-f116a.firebaseapp.com",
  projectId: "mindgames-f116a",
  storageBucket: "mindgames-f116a.firebasestorage.app",
  messagingSenderId: "296415432842",
  appId: "1:296415432842:web:b97e2e2710f1c75ee89d73",
  measurementId: "G-HC8N4Y4R49"
};

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp);

    window.fbAuth = auth;
    window.fbDb = db;
    window.fbCreateUser = createUserWithEmailAndPassword;
    window.fbSignIn = signInWithEmailAndPassword;
    window.fbSignOut = signOut;
    window.fbResetPassword = sendPasswordResetEmail;
    window.fbUpdateProfile = updateProfile;
    window.fbDoc = doc;
    window.fbGetDoc = getDoc;
    window.fbSetDoc = setDoc;
    window.fbAddDoc = addDoc;
    window.fbGetDocs = getDocs;
    window.fbCollection = collection;
    window.fbQuery = query;
    window.fbWhere = where;
    window.fbOrderBy = orderBy;
    window.fbLimit = limit;
    window.fbTimestamp = serverTimestamp;
    window.fbIncrement = increment;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        window.currentUser = user;
        try {
          const userDocRef = doc(db, "users", user.uid);
          const userDocSnap = await getDoc(userDocRef);

          if (!userDocSnap.exists() || !userDocSnap.data().profileCompleted) {
            window.app.renderOnboarding();
          } else {
            window.currentUserData = userDocSnap.data();
            window.app.updateHeader();
            window.app.navToWelcome();
          }
        } catch (e) {
          console.error("Auth state update error:", e);
        }
      } else {
        window.currentUser = null;
        window.currentUserData = null;
        document.getElementById('header-profile').classList.add('hidden');
        window.app.renderAuth('signin');
      }
    });
  </script>
